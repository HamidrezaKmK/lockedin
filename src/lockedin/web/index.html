<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lockedin — research assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
<!-- Toast UI Editor: Notion-like markdown editor (markdown stays source of truth) -->
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css">
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --ink:#e6e9ef; --muted:#9aa3b2; --accent:#7c9cff; --accent2:#5ce6c4;
    --warn:#ffcc66; --bad:#ff7a7a; --good:#5ce6a0; --radius:12px;
  }
  /* Light mode */
  body.light{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --line:#d0d7e3;
    --ink:#1a1d24; --muted:#6b7280; --accent:#3b5bdb; --accent2:#0d9488;
    --warn:#b45309; --bad:#dc2626; --good:#16a34a;
  }
  body.light .msg.assistant{background:#f0f4ff}
  body.light .toastui-editor-defaultUI{filter:invert(1) hue-rotate(180deg)}
  body.light .toastui-editor-defaultUI img{filter:invert(1) hue-rotate(180deg)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);overflow:hidden;overflow:clip}
  /* Auth screen can scroll internally on very short viewports (body itself never scrolls) */
  #auth{overflow-y:auto}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
         color:var(--ink);border-radius:8px;padding:7px 12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#0b0e14;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent}
  input,textarea,select{font:inherit;background:var(--panel);color:var(--ink);
         border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  textarea{resize:vertical}
  a{color:var(--accent);text-decoration:none}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
  .pill.suggest{border-color:var(--warn);color:var(--warn)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}
  .hide{display:none!important}

  /* auth */
  #auth{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  #auth .card{width:360px}
  .brand{font-size:22px;font-weight:700}
  .brand .lock{color:var(--accent2)}
  .err{color:var(--bad);min-height:18px;font-size:13px}

  /* shell */
  #app{display:none;height:100vh;overflow:hidden;overflow:clip;grid-template-rows:auto 1fr;
       grid-template-columns:220px minmax(0,1fr);
       grid-template-areas:"top top" "side main"}
  #topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:10px 16px;
          border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
  #topbar #modelTabs{min-width:0;overflow:hidden}
  #side{grid-area:side;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;
        overflow:hidden;transition:width .2s ease,padding .15s ease}
  /* min-height/min-width:0 let the grid track govern size (no hardcoded topbar height,
     no flex/grid blowout from wide content → no surprise global scrollbars) */
  #main{grid-area:main;padding:18px 22px;overflow:auto;min-width:0;min-height:0;box-sizing:border-box}
  /* overflow:clip (with hidden fallback) — clips like hidden but is NOT a scroll container, so a
     focus/scrollIntoView inside the editor can't programmatically scroll these layout boxes and
     leave them stuck (the editor's own internal scroller absorbs it instead). */
  #main.detailmode{overflow:hidden;overflow:clip;display:flex;flex-direction:column;padding-bottom:0;min-height:0}
  .navbtn{display:block;width:100%;text-align:left;border:none;background:transparent;
          padding:10px 12px;border-radius:8px;color:var(--muted);margin-bottom:4px}
  .navbtn.active{background:var(--panel2);color:var(--ink)}

  /* model switcher */
  .mtab{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel2)}
  .mtab.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mtab .gear{opacity:.6}
  #modelCfg{position:absolute;top:52px;right:16px;width:340px;max-width:calc(100vw - 32px);
            max-height:calc(100vh - 70px);overflow:auto;z-index:30}

  /* grids */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px;cursor:pointer;transition:border-color .15s}
  .acard:hover{border-color:var(--accent)}
  .acard h4{margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);
         color:var(--warn)}

  /* bubble detail */
  #detail{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;flex:1;
          min-height:0;min-width:0}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;overflow:clip}
  .pane .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;
            align-items:center;flex-wrap:wrap;flex:0 0 auto;min-width:0}
  .pane .bd{padding:12px;overflow:auto;flex:1;min-height:0;min-width:0}
  #editor{width:100%;height:100%;min-height:340px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          font-size:13px;border:none;background:transparent;resize:none}
  .preview{line-height:1.6;overflow-wrap:anywhere;word-break:break-word}
  .preview h1{font-size:24px} .preview h2{font-size:19px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .preview code{background:var(--panel2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
  .preview pre{background:var(--panel2);padding:10px;border-radius:8px;overflow:auto}
  .preview pre code{overflow-wrap:normal;word-break:normal}
  .preview img{max-width:100%;height:auto;border-radius:8px}
  /* tables + blockquotes — shared by the preview pane and chat messages */
  .preview table,.msg table{display:block;width:max-content;max-width:100%;overflow-x:auto;
        border-collapse:collapse;margin:8px 0;font-size:13px}
  .preview th,.preview td,.msg th,.msg td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .preview thead th,.msg thead th{background:var(--panel2)}
  .preview blockquote,.msg blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);
        color:var(--muted);background:var(--panel2);border-radius:0 6px 6px 0}
  .preview blockquote p,.msg blockquote p{margin:4px 0}
  /* Wide display-math scrolls inside its block instead of stretching the pane */
  .katex-display{overflow-x:auto;overflow-y:hidden;max-width:100%}
  .eq-ref{color:var(--accent);font-weight:500}

  /* chat */
  #chatlog{display:flex;flex-direction:column;gap:10px;min-width:0}
  .msg{padding:9px 11px;border-radius:10px;max-width:95%;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .msg pre{overflow:auto;max-width:100%}
  .msg img{max-width:100%;height:auto}
  .msg .katex-display{overflow-x:auto;overflow-y:hidden}
  .msg.user{align-self:flex-end;background:var(--panel2)}
  .msg.assistant{align-self:flex-start;background:#13202b;border:1px solid var(--line)}
  .synced{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--good);color:var(--good)}
  .synced.stale{border-color:var(--warn);color:var(--warn)}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .small{font-size:12px;padding:5px 9px}
  .deepitem{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
  h2.section-title{margin:0 0 14px}
  .spacer{flex:1}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);
         border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:50}

  /* modal overlay (used by the help modal) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
           justify-content:center;z-index:60}
  .diffbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
           width:min(840px,93vw);max-height:85vh;display:flex;flex-direction:column}
  .diffbody{overflow:auto;padding:10px 12px;line-height:1.5}

  /* chat pane collapse */
  #detail.chat-collapsed{grid-template-columns:1fr}
  #detail.chat-collapsed>.pane:last-child{display:none!important}
  /* preview-pane toggle is handled via S.previewEl.classList.toggle("hide") */

  /* page tabs + editor host */
  .ptabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 10px;
         border-bottom:1px solid var(--line);flex:0 0 auto;min-width:0}
  .ptab{padding:4px 10px;border-radius:7px 7px 0 0;border:1px solid var(--line);
        background:var(--panel2);cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
  .ptab.active{border-color:var(--accent);color:var(--ink);background:var(--bg)}
  .ptab .x{opacity:.5;font-size:11px}
  .ptab .x:hover{opacity:1;color:var(--bad)}
  #editorHost{flex:1;min-height:0;min-width:0;display:flex;overflow:hidden;overflow:clip}
  #editorWrap{flex:1;min-height:0;min-width:0;overflow:hidden;overflow:clip}
  #editorWrap .toastui-editor-defaultUI{height:100%}
  #previewWrap{flex:1;overflow:auto;padding:12px 16px;border-left:1px solid var(--line);
               min-width:0;min-height:0;line-height:1.6}
  /* Hide Toast UI's built-in preview controls — we use our own custom renderer */
  .toastui-editor-mode-switch{display:none!important}
  .toastui-editor-tabs{display:none!important}
  .wikilink{color:var(--accent2);border-bottom:1px dashed var(--accent2);cursor:pointer}
  .scopebar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
  .scopebar select{width:auto;max-width:230px}
  .sessionbar{display:flex;gap:6px;align-items:center;padding:5px 10px;
              border-bottom:1px solid var(--line);flex:0 0 auto}
  .sessionbar select{flex:1;font-size:12px}
  /* deep-read pill selector */
  .drwrap{padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .drpills{display:flex;flex-wrap:wrap;gap:5px;min-height:0}
  .drpill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);
           border:1px solid var(--accent2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--accent2)}
  .drpill .x{opacity:.6;cursor:pointer} .drpill .x:hover{opacity:1;color:var(--bad)}
  .drrow{display:flex;gap:6px;align-items:center}
  .drrow select{flex:1;font-size:12px}
  /* sessions management panel */
  .sessions-panel{border-bottom:1px solid var(--line);flex:0 0 auto;max-height:180px;overflow-y:auto}
  .session-row{display:flex;align-items:center;gap:6px;padding:5px 10px;border-top:1px solid var(--line);font-size:12px}
  .session-row:first-child{border-top:none}
  .session-row .session-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}

  /* ── Mobile ── */
  @media (max-width:700px){
    /* On phones the whole page scrolls naturally instead of a locked app shell. */
    html,body{height:auto;overflow:visible}
    #app{height:auto;min-height:100vh;overflow:visible;grid-template-columns:0 minmax(0,1fr)!important}
    /* keep the topbar pinned while the page scrolls */
    #topbar{position:sticky;top:0;z-index:25;padding:8px 10px;gap:8px}
    /* always collapse sidebar — hamburger still toggles it as a narrow overlay */
    #side{width:0!important;min-width:0!important;padding:0!important;border-right:none!important;
          position:fixed;top:49px;bottom:0;left:0;z-index:20;box-shadow:2px 0 12px rgba(0,0,0,.4)}
    #app.side-open #side{width:220px!important;padding:14px 10px!important;border-right:1px solid var(--line)!important}
    #app.side-open::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}
    /* main scrolls with the page */
    #main{height:auto;overflow:visible}
    #main.detailmode{height:auto;overflow:visible;min-height:0}
    /* stack bubble detail panes; each pane gets a usable fixed height + internal scroll */
    #detail{grid-template-columns:1fr;min-height:0}
    .pane{height:78vh;min-height:320px}
    /* stack editor over preview rather than a cramped side-by-side split */
    #editorHost{flex-direction:column}
    #previewWrap{border-left:none;border-top:1px solid var(--line)}
    /* hide model tabs — too wide for mobile */
    #modelTabs{display:none}
    /* single-column cards */
    .grid{grid-template-columns:1fr}
    .brand{font-size:18px}
  }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth">
  <div class="card col">
    <div class="brand">🔒 <span class="lock">locked</span>in</div>
    <div class="muted">The ultimate research assistant for grad students.</div>
    <input id="au_user" placeholder="username" autocomplete="username">
    <input id="au_pass" type="password" placeholder="password" autocomplete="current-password">
    <div class="row">
      <button class="primary" id="au_login">Log in</button>
      <button id="au_signup">Sign up</button>
    </div>
    <div class="err" id="au_err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div id="topbar">
    <button class="ghost small" id="sideToggle" title="Toggle sidebar" style="font-size:16px;padding:5px 10px">☰</button>
    <div class="brand">🔒 <span class="lock">locked</span>in</div>
    <div class="row" id="modelTabs"></div>
    <div class="spacer"></div>
    <span class="muted" id="who"></span>
    <button class="ghost small" id="helpBtn" title="User guide">?</button>
    <button class="ghost small" id="themeToggle" title="Toggle light/dark mode">☀️</button>
    <button class="ghost small" id="logout">Log out</button>
  </div>

  <div id="side">
    <button class="navbtn active" data-view="assets">📚 Assets</button>
    <button class="navbtn" data-view="bubbles">💡 Idea Bubbles</button>
    <button class="navbtn" data-view="attention">🔔 Attention <span id="attnCount" class="muted"></span></button>
  </div>

  <div id="main"></div>
</div>

<div id="modelCfg" class="card col hide"></div>
<div id="helpModal" class="overlay hide">
  <div class="diffbox" style="width:min(780px,95vw);max-height:88vh">
    <div class="hd"><b>User Guide</b><span class="spacer"></span>
      <button class="ghost small" id="helpClose">✕</button></div>
    <div class="diffbody preview" id="helpBody" style="font-family:inherit;font-size:14px;padding:16px 20px"></div>
  </div>
</div>
<div id="toast" class="toast hide"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const el = (t,a={},...kids)=>{const e=document.createElement(t);
    for(const k in a){ if(k==="class")e.className=a[k]; else if(k==="html")e.innerHTML=a[k];
      else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]); else e.setAttribute(k,a[k]); }
    for(const c of kids){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(c)); }
    return e;};
  const toast = (m)=>{const t=$("#toast"); t.textContent=m; t.classList.remove("hide");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add("hide"),2600);};

  // ---------- sidebar toggle ----------
  function applySideCollapsed(collapsed){
    const side=document.getElementById("side"), app=document.getElementById("app");
    if(!side||!app)return;
    if(collapsed){
      side.style.width="0"; side.style.padding="0"; side.style.borderRight="none";
      app.style.gridTemplateColumns="0 1fr";
    } else {
      side.style.width=""; side.style.padding=""; side.style.borderRight="";
      app.style.gridTemplateColumns="220px 1fr";
    }
  }
  document.getElementById("sideToggle").onclick=()=>{
    if(window.innerWidth<=700){
      // Mobile: toggle overlay class; tap backdrop to close
      document.getElementById("app").classList.toggle("side-open");
    } else {
      const next=localStorage.getItem("li_side")!=="1";
      localStorage.setItem("li_side",next?"1":"0");
      applySideCollapsed(next);
    }
  };
  // Close mobile sidebar when tapping the backdrop
  document.getElementById("app").addEventListener("click",e=>{
    if(e.target===e.currentTarget&&window.innerWidth<=700)
      e.currentTarget.classList.remove("side-open");
  });
  // Close mobile sidebar when a nav item is tapped
  document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{
    if(window.innerWidth<=700) document.getElementById("app").classList.remove("side-open");
  }));

  // ---------- hash routing ----------
  function pushRoute(hash){history.pushState(null,"",hash?"#"+hash:"#");}
  function applyHash(){
    const h=location.hash.replace(/^#/,"");
    if(!h||h==="assets"){switchView("assets",{noRoute:true});return;}
    if(h==="bubbles"){switchView("bubbles",{noRoute:true});return;}
    if(h==="attention"){switchView("attention",{noRoute:true});return;}
    const m=h.match(/^bubble\/([^/]+)$/);
    if(m){openBubble(m[1],{noRoute:true});return;}
    switchView("assets",{noRoute:true});
  }
  window.onpopstate=()=>applyHash();

  // ---------- api ----------
  function claudeHeaders(){
    const tok=localStorage.getItem("claude_oauth_token");
    return tok?{"X-Claude-Token":tok}:{};
  }
  async function api(path, opts={}){
    const r = await fetch(path, {credentials:"include", headers:{"Content-Type":"application/json",...claudeHeaders()}, ...opts});
    if(!r.ok){ let d; try{d=(await r.json()).detail;}catch(e){d=r.statusText;} throw new Error(d||"Error"); }
    const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
  }
  // SSE over POST; returns AbortController. onEvent({type,...}).
  function streamPost(path, body, onEvent){
    const ac = new AbortController();
    (async()=>{
      const r = await fetch(path,{method:"POST",credentials:"include",signal:ac.signal,
        headers:{"Content-Type":"application/json",...claudeHeaders()},body:JSON.stringify(body)});
      const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
      while(true){
        const {value,done}=await reader.read(); if(done)break;
        buf+=dec.decode(value,{stream:true});
        let i; while((i=buf.indexOf("\n\n"))>=0){
          const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
          if(line.startsWith("data:")){ try{ onEvent(JSON.parse(line.slice(5).trim())); }catch(e){} }
        }
      }
    })().catch(e=>{ if(e.name!=="AbortError") onEvent({type:"error",detail:e.message}); });
    return ac;
  }

  // ---------- markdown + math ----------
  function renderMarkdown(md){
    const store=[]; let s=md||"";
    // Pass 1 — collect \label{} from display math, assign sequential numbers
    const eqN={};let eqI=0;
    const _dr=/\$\$([\s\S]+?)\$\$/g; let _dm;
    while((_dm=_dr.exec(s))!==null){
      const lb=(_dm[1].match(/\\label\{([^}]+)\}/)||[])[1];
      if(lb&&!(lb in eqN))eqN[lb]=++eqI;
    }
    // Pass 2 — replace \label{lbl} with \tag{n} inside $$...$$ blocks
    if(eqI>0) s=s.replace(/\$\$([\s\S]+?)\$\$/g,(f,inner)=>{
      const lb=(inner.match(/\\label\{([^}]+)\}/)||[])[1];
      return lb&&eqN[lb]?"$$"+inner.replace(/\\label\{[^}]+\}/,"\\tag{"+eqN[lb]+"}") +"$$":f;
    });
    // Stash all math tokens so marked.js can't mangle them
    const stash=(re,display)=>{ s=s.replace(re,(m,p1)=>{ store.push({src:p1,display}); return `@@M${store.length-1}@@`; }); };
    stash(/\$\$([\s\S]+?)\$\$/g,true);
    stash(/\\\[([\s\S]+?)\\\]/g,true);
    stash(/\\\(([\s\S]+?)\\\)/g,false);
    stash(/\$([^\$\n]+?)\$/g,false);
    // Pass 3 — replace \eqref{}/\ref{} in remaining (non-math) text
    if(eqI>0){
      s=s.replace(/\\eqref\{([^}]+)\}/g,(_,lb)=>`<span class="eq-ref">(${eqN[lb]||"?"})</span>`);
      s=s.replace(/\\ref\{([^}]+)\}/g,(_,lb)=>`<span class="eq-ref">${eqN[lb]||"?"}</span>`);
    }
    let html=marked.parse(s,{breaks:true});
    html=html.replace(/@@M(\d+)@@/g,(m,i)=>{ const it=store[+i];
      try{ return katex.renderToString(it.src,{displayMode:it.display,throwOnError:false}); }
      catch(e){ return `<span style="color:#ff7a7a">${it.src}</span>`; } });
    return html;
  }

  // ---------- state ----------
  const S = { user:null, model:null, view:"assets", bubble:null, chat:[],
    editor:null, page:null, pages:[], home:null, bubbleInstr:"", bubbleAssets:[],
    sessionId:null, sessionTitle:null,

    pollTimer:null, lastPageMtime:null, lastManifestMtime:null,

  };

  // ================= AUTH =================
  async function doAuth(kind){
    const username=$("#au_user").value.trim(), password=$("#au_pass").value;
    $("#au_err").textContent="";

    catch(e){ $("#au_err").textContent=e.message; }
  }
  $("#au_login").onclick=()=>doAuth("login");
  $("#au_signup").onclick=()=>doAuth("signup");
  $("#au_pass").onkeydown=e=>{ if(e.key==="Enter")doAuth("login"); };

  $("#helpBtn").onclick=async()=>{
    const modal=$("#helpModal"), body=$("#helpBody");
    modal.classList.remove("hide");
    if(!body.dataset.loaded){
      try{
        const r=await api("/api/help");
        body.innerHTML=renderMarkdown(r.guide);
        body.dataset.loaded="1";
      }catch(e){ body.textContent="Could not load guide."; }
    }
  };

  $("#helpModal").onclick=e=>{ if(e.target===e.currentTarget)$("#helpModal").classList.add("hide"); };
  $("#themeToggle").onclick=()=>{
    const light=document.body.classList.toggle("light");
    $("#themeToggle").textContent=light?"🌙":"☀️";

  };
  if(localStorage.getItem("li_theme")==="light"){ document.body.classList.add("light"); $("#themeToggle").textContent="🌙"; }

  async function boot(){
    let me; try{ me=await api("/api/me"); }catch(e){ return; }
    S.user=me.user; S.model=me.model;
    $("#auth").style.display="none"; $("#app").style.display="grid";
    $("#who").textContent="@"+S.user;
    applySideCollapsed(localStorage.getItem("li_side")==="1");
    renderModelTabs(); refreshHealth(); applyHash();
  }

  // ================= MODEL SWITCHER =================
  const PROV=[{k:"qwen",label:"🖥 Qwen (local)"},{k:"openai",label:"OpenAI"},{k:"claude",label:"Claude"},{k:"gemini",label:"Gemini"}];
  const MODEL_SUGGESTIONS={
    qwen:["qwen2.5:7b-instruct","qwen2.5:14b-instruct","qwen2.5:32b-instruct","qwen2.5:72b-instruct"],
    openai:["gpt-4o","gpt-4o-mini","o3-mini","o1","o1-mini"],
    claude:["claude-opus-4-8","claude-sonnet-4-6","claude-haiku-4-5-20251001"],
    gemini:["gemini-2.5-pro","gemini-2.5-flash-preview-05-20","gemini-2.0-flash","gemini-1.5-pro"],
  };
  function renderModelTabs(){
    const wrap=$("#modelTabs"); wrap.innerHTML="";
    PROV.forEach(p=>{
      const active=S.model.active===p.k;
      const dot=el("span",{class:"dot",id:"dot_"+p.k});
      const tab=el("div",{class:"mtab"+(active?" active":"")},
        dot, el("span",{},p.label),
        el("span",{class:"gear",title:"Configure",onclick:(ev)=>{ev.stopPropagation();openCfg(p.k);}},"⚙"));
      tab.onclick=()=>setActive(p.k);
      wrap.append(tab);
    });
  }
  async function setActive(k){
    try{ const r=await api("/api/settings/model/active",{method:"PUT",body:JSON.stringify({active:k})});
      S.model=r.config; renderModelTabs(); refreshHealth(); toast("Active model: "+k);
      const badge=$("#chatModelBadge"); if(badge)badge.textContent=k; }
    catch(e){ toast(e.message); }
  }
  function openCfg(k){
    const box=$("#modelCfg"); const cfg=S.model[k]||{};
    box.innerHTML="";
    box.append(el("div",{class:"row"}, el("b",{},"Configure "+k), el("span",{class:"spacer"}),
      el("button",{class:"ghost small",onclick:()=>box.classList.add("hide")},"✕")));
    const inputs={};
    const field=(key,label,val,type,suggestions)=>{
      box.append(el("label",{class:"muted"},label));
      const inp=el("input",{value:val||""}); if(type)inp.type=type;
      if(suggestions&&suggestions.length){
        const dlId="dl_"+k+"_"+key;
        const dl=el("datalist",{id:dlId});
        suggestions.forEach(s=>dl.append(el("option",{value:s})));
        box.append(dl); inp.setAttribute("list",dlId);
      }
      inputs[key]=inp; box.append(inp); return inp;
    };

    if(k==="qwen"){
      field("base_url","Ollama base URL",cfg.base_url||"http://localhost:11434/v1");
      field("model","Model name",cfg.model||"qwen2.5:7b-instruct",null,MODEL_SUGGESTIONS.qwen);
    } else if(k==="openai"){
      field("model","Model name",cfg.model||"gpt-4o",null,MODEL_SUGGESTIONS.openai);
      field("api_key","API key",cfg.api_key,"password");
    } else if(k==="gemini"){
      field("model","Model name",cfg.model||"gemini-2.5-flash-preview-05-20",null,MODEL_SUGGESTIONS.gemini);
      field("api_key","API key (from aistudio.google.com/apikey)",cfg.api_key,"password");
    } else { // claude — API key OR subscription (OAuth token)
      field("model","Model name",cfg.model||"claude-sonnet-4-6",null,MODEL_SUGGESTIONS.claude);
      box.append(el("label",{class:"muted"},"Authentication"));
      const sel=el("select");
      [["api_key","API key (pay-per-token)"],["subscription","Claude subscription (OAuth token)"]]
        .forEach(([v,t])=>sel.append(el("option",{value:v},t)));
      sel.value=cfg.auth_method||"api_key"; inputs.auth_method=sel; box.append(sel);
      const keyWrap=el("div",{class:"col"}), tokWrap=el("div",{class:"col"});
      const keyInp=el("input",{type:"password",value:cfg.api_key||""}); inputs.api_key=keyInp;
      keyWrap.append(el("label",{class:"muted"},"Anthropic API key"),keyInp);
      const tokInp=el("input",{type:"password",value:localStorage.getItem("claude_oauth_token")||""}); inputs.oauth_token=tokInp;
      tokWrap.append(el("label",{class:"muted"},"Subscription OAuth token"),tokInp,
        el("div",{class:"muted",style:"font-size:11px"},
          "Paste your Claude OAuth token. Stored only in your browser — never sent to the server."));
      box.append(keyWrap,tokWrap);
      const sync=()=>{ const sub=sel.value==="subscription";
        keyWrap.classList.toggle("hide",sub); tokWrap.classList.toggle("hide",!sub); };
      sel.onchange=sync; sync();
    }
    box.append(el("div",{class:"row"}, el("button",{class:"primary",onclick:async()=>{
        const patch={}; patch[k]={}; for(const key in inputs)patch[k][key]=inputs[key].value;
        if(k==="claude"){
          if(inputs.auth_method&&inputs.auth_method.value==="subscription"){
            localStorage.setItem("claude_oauth_token", patch[k].oauth_token||"");
          } else {
            localStorage.removeItem("claude_oauth_token");
          }
          patch[k].oauth_token=""; // never persist the token server-side
        }
        const r=await api("/api/settings/model",{method:"PUT",body:JSON.stringify({config:patch})});
        S.model=r.config; box.classList.add("hide"); renderModelTabs(); refreshHealth(); toast("Saved "+k+" config");
      }},"Save")));
    box.classList.remove("hide");
  }
  async function refreshHealth(){
    PROV.forEach(p=>{const d=$("#dot_"+p.k); if(d)d.className="dot";});
    try{ const h=await api("/api/health"); const d=$("#dot_"+h.active);
      if(d)d.className="dot "+(h.ok?"ok":"bad"); }catch(e){}

  // ================= NAV =================
  document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
  function switchView(v,{noRoute=false}={}){
    S.view=v; S.bubble=null;
    stopPolling();
    document.getElementById("main").classList.remove("detailmode");
    document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
    if(!noRoute)pushRoute(v==="assets"?"":v);

  async function refreshAttnCount(){
    try{ const r=await api("/api/attention"); $("#attnCount").textContent=r.assets.length?`(${r.assets.length})`:""; }
    catch(e){}

  // ================= ASSETS =================
  async function viewAssets(){
    const m=$("#main"); m.innerHTML="";
    m.append(el("h2",{class:"section-title"},"📚 Assets"));

    // upload form
    const f=el("div",{class:"card col"});
    const file=el("input",{type:"file",accept:"application/pdf"});
    const title=el("input",{placeholder:"Title (optional)"});
    const tags=el("input",{placeholder:"Idea-bubble tags, comma-separated (leave blank to auto-tag)"});
    const url=el("input",{placeholder:"Source URL (optional)"});
    const btn=el("button",{class:"primary"},"Upload PDF");
    btn.onclick=async()=>{
      if(!file.files[0]){toast("Choose a PDF first.");return;}
      const fd=new FormData(); fd.append("file",file.files[0]);
      fd.append("title",title.value); fd.append("tags",tags.value); fd.append("url_source",url.value);
      btn.disabled=true; btn.textContent="Uploading…";
      try{ const r=await fetch("/api/assets/upload",{method:"POST",credentials:"include",body:fd});
        if(!r.ok)throw new Error((await r.json()).detail);
        const d=await r.json();
        toast(d.attention_flag?"Uploaded — auto-tagging in background…":"Uploaded — summarizing in background…");
        file.value="";title.value="";tags.value="";url.value="";
        viewAssets();
      }catch(e){toast(e.message);} finally{btn.disabled=false;btn.textContent="Upload PDF";}
    };
    f.append(el("b",{},"Add a paper / blogpost"),file,title,tags,url,btn);
    m.append(f, el("div",{style:"height:16px"}));

    const r=await api("/api/assets");
    if(!r.assets.length){ m.append(el("div",{class:"muted"},"No assets yet. Upload your first PDF above.")); return; }
    const grid=el("div",{class:"grid"});
    r.assets.forEach(a=>grid.append(assetCard(a)));
    m.append(grid);
  }
  function assetCard(a){
    const c=el("div",{class:"acard"});
    const head=el("div",{class:"row"}, el("h4",{},a.title||a.filename||a.pdf_id));
    if(a.attention_flag)head.append(el("span",{class:"badge"},"needs review"));
    c.append(head);
    const tagWrap=el("div",{});
    (a.tags||[]).forEach(t=>tagWrap.append(el("span",{class:"pill"},t)));
    (a.suggested_tags||[]).forEach(t=>tagWrap.append(el("span",{class:"pill suggest"},"? "+t)));
    c.append(tagWrap);
    c.append(el("div",{class:"muted",style:"font-size:12px;margin-top:6px"},
      (a.summarized?"summarized • ":"") + (a.date_added||"").slice(0,10)));
    c.onclick=()=>openAssetEditor(a);
    return c;
  }
  async function openAssetEditor(a){
    const m=$("#main"); m.innerHTML="";
    m.append(el("button",{class:"ghost small",onclick:viewAssets},"← Assets"));
    const box=el("div",{class:"card col",style:"margin-top:12px;max-width:720px"});
    const title=el("input",{value:a.title||""});
    const tags=el("input",{value:(a.tags||[]).join(", ")});
    const notes=el("textarea",{rows:"4"}); notes.value=a.notes||"";
    const url=el("input",{value:a.url_source||""});
    box.append(el("b",{},"Edit asset"),
      el("label",{class:"muted"},"Title"),title,
      el("label",{class:"muted"},"Tags (comma-separated)"),tags,
      el("label",{class:"muted"},"Notes"),notes,
      el("label",{class:"muted"},"Source URL"),url);
    if((a.suggested_tags||[]).length){
      const sg=el("div",{class:"row"},el("span",{class:"muted"},"Suggested:"));
      a.suggested_tags.forEach(t=>{ const p=el("span",{class:"pill suggest",style:"cursor:pointer"},"+ "+t);
        p.onclick=()=>{ tags.value=(tags.value?tags.value+", ":"")+t; }; sg.append(p); });
      box.append(sg);
    }
    box.append(el("div",{class:"row"},
      el("button",{class:"primary",onclick:async()=>{
        const tagList=tags.value.split(",").map(s=>s.trim()).filter(Boolean);
        await api("/api/assets/"+a.pdf_id,{method:"PATCH",body:JSON.stringify({
          title:title.value,tags:tagList,notes:notes.value,url_source:url.value,
          attention_flag:false})});
        for(const t of tagList){ await api("/api/bubbles",{method:"POST",body:JSON.stringify({name:t})}); }
        toast("Saved"); viewAssets();
      }},"Save & clear flag"),
      el("a",{href:"/api/assets/"+a.pdf_id+"/pdf",target:"_blank"},
        el("button",{class:"ghost"},"Open PDF")),
      el("span",{class:"spacer"}),
      el("button",{class:"ghost",onclick:async()=>{ if(confirm("Delete this asset?")){
        await api("/api/assets/"+a.pdf_id,{method:"DELETE"}); toast("Deleted"); viewAssets(); }}},"Delete")));
    m.append(box);
    // show cached summary
    const sumWrap=el("div",{class:"card",style:"margin-top:12px;max-width:720px"});
    sumWrap.append(el("b",{},"AI summary"));
    const body=el("div",{class:"preview",style:"margin-top:8px"});
    let sum=""; try{ sum=(await api("/api/assets/"+a.pdf_id+"/summary")).summary; }catch(e){}
    body.innerHTML=renderMarkdown(sum||"_Not summarized yet._");
    sumWrap.append(body); m.append(sumWrap);

  // ================= IDEA BUBBLES =================
  async function viewBubbles(){
    const m=$("#main"); m.innerHTML="";
    const head=el("div",{class:"row"}, el("h2",{class:"section-title",style:"margin:0"},"💡 Idea Bubbles"),
      el("span",{class:"spacer"}),
      el("button",{class:"primary small",onclick:newBubble},"+ New bubble"));
    m.append(head, el("div",{style:"height:14px"}));
    const r=await api("/api/bubbles");
    if(!r.bubbles.length){ m.append(el("div",{class:"muted"},"No idea bubbles yet. Tag a PDF or create one.")); return; }
    const grid=el("div",{class:"grid"});
    r.bubbles.forEach(b=>{
      const c=el("div",{class:"acard"});
      const h=el("div",{class:"row"}, el("h4",{style:"margin:0"},b.name));

  async function newBubble(){
    const name=prompt("Name your idea bubble (e.g. 'optimal transport'):"); if(!name)return;
    const r=await api("/api/bubbles",{method:"POST",body:JSON.stringify({name})});
    openBubble(r.slug);
  }
  async function deleteBubble(slug, name, onDone){
    if(!confirm(`Delete the idea bubble "${name}"?\n\nThis permanently removes all its report pages and figures. PDFs tagged with it will have this tag removed. This cannot be undone.`)) return;
    try{ await api("/api/bubbles/"+slug,{method:"DELETE"}); toast("Bubble deleted"); onDone&&onDone(); }
    catch(e){ toast("Error: "+e.message); }
  }

  function startBubbleRename(nameSpan, slug){
    const current=nameSpan.textContent.replace(/\s*\(suggested\)$/,"").trim();
    const inp=el("input",{value:current,style:"width:180px;flex-shrink:1"});
    const save=el("button",{class:"primary small",onclick:async()=>{
      const val=inp.value.trim(); if(!val||val===current){restore();return;}
      try{
        await api("/api/bubbles/"+slug,{method:"PATCH",body:JSON.stringify({name:val})});
        nameSpan.textContent=val; restore(); toast("Renamed");
      }catch(e){toast(e.message);}
    }},"Save");
    const cancel=el("button",{class:"ghost small",onclick:restore},"Cancel");
    inp.onkeydown=e=>{if(e.key==="Enter")save.click();if(e.key==="Escape")restore();};
    // swap span for the edit controls
    nameSpan.replaceWith(inp,save,cancel);
    inp.focus(); inp.select();
    function restore(){[save,cancel].forEach(b=>b.remove()); inp.replaceWith(nameSpan);}
  }

  // ================= BUBBLE DETAIL (Notion-like multi-page) =================

    if(S.editor){ try{S.editor.destroy();}catch(e){} S.editor=null; }

  // ---- workspace: page tabs + Toast UI editor ----
  function buildWorkspace(left,b){
    S.pages=b.pages||[]; S.home=b.home; S.bubbleInstr=b.instructions||"";
    const tabs=el("div",{class:"ptabs",id:"ptabs"});
    const editorWrap=el("div",{id:"editorWrap"});
    S.previewEl=el("div",{id:"previewWrap",class:"preview"});
    if(localStorage.getItem("li_preview_off")==="1") S.previewEl.classList.add("hide");
    const host=el("div",{id:"editorHost"});
    host.append(editorWrap, S.previewEl);
    left.append(tabs,host);

    // PDFs strip
    const pdfs=el("div",{class:"bd",style:"flex:0 0 auto;border-top:1px solid var(--line);max-height:120px"});
    pdfs.append(el("b",{},"Papers in this bubble"));
    (b.assets||[]).forEach(a=>pdfs.append(el("div",{class:"truncate",style:"font-size:12px;margin-top:3px"},
      el("a",{href:"/api/assets/"+a.pdf_id+"/pdf",target:"_blank",title:a.title||a.pdf_id},a.title||a.pdf_id))));
    if(!b.assets.length)pdfs.append(el("div",{class:"muted"},"None yet — tag a PDF with this bubble."));
    left.append(pdfs);

    // init editor with the home page content
    initEditor(editorWrap, b.content||"");
    S.page=b.home;
    refreshTabs();
    startPolling();
    // delegated internal-link navigation (page: scheme)
    left.addEventListener("click",e=>{ const a=e.target.closest('a[href^="page:"]');
      if(a){ e.preventDefault(); switchPage(decodeURIComponent(a.getAttribute("href").slice(5))); } });

  function initEditor(host, initialValue){
    S.editor=new toastui.Editor({
      el:host, height:"100%", theme:"dark", initialEditType:"markdown",
      previewStyle:"tab", initialValue, usageStatistics:false,
      hooks:{ addImageBlobHook:(blob,cb)=>uploadImage(S.bubble,blob,cb) },
    });
    let deb;
    S.editor.on("change",()=>{ markStale(); clearTimeout(deb);
      deb=setTimeout(updatePreview,300); });
    setTimeout(updatePreview,200);
  }

  function updatePreview(){
    if(!S.previewEl||!S.editor)return;
    S.previewEl.innerHTML=renderMarkdown(S.editor.getMarkdown());
    linkifyWikilinks(S.previewEl);
  }

  function uploadImage(slug,blob,cb){
    const fd=new FormData(); fd.append("file",blob,(blob.name||"figure.png"));
    fetch("/api/bubbles/"+slug+"/assets",{method:"POST",credentials:"include",body:fd})
      .then(r=>r.json()).then(d=>cb(d.url,"figure")).catch(()=>toast("Image upload failed"));
  }
  function linkifyWikilinks(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    const targets=[]; let n; while(n=walker.nextNode()){ if(/\[\[[^\]]+\]\]/.test(n.nodeValue)
      && !n.parentElement.closest("a")) targets.push(n); }
    targets.forEach(node=>{
      const s=node.nodeValue, frag=document.createDocumentFragment(); let last=0,mm;
      const re=/\[\[([^\]]+)\]\]/g;
      while(mm=re.exec(s)){ if(mm.index>last)frag.append(s.slice(last,mm.index));
        const a=document.createElement("a"); a.href="page:"+encodeURIComponent(mm[1].trim());
        a.textContent=mm[1]; a.className="wikilink"; frag.append(a); last=re.lastIndex; }
      if(last<s.length)frag.append(s.slice(last));
      node.parentNode.replaceChild(frag,node);
    });
  }

  // ---- page tabs ----
  function refreshTabs(){
    const tabs=$("#ptabs"); if(!tabs)return; tabs.innerHTML="";
    S.pages.forEach(p=>{
      const t=el("div",{class:"ptab"+(p.page_slug===S.page?" active":"")});
      t.append(el("span",{onclick:()=>switchPage(p.page_slug)},p.title));
      if(p.page_slug!==S.home)
        t.append(el("span",{class:"x",title:"Delete page",onclick:(e)=>{e.stopPropagation();deletePage(p.page_slug);}},"✕"));
      tabs.append(t);
    });
    tabs.append(el("button",{class:"small ghost",onclick:newPage},"+ Page"));
    tabs.append(el("span",{class:"spacer",style:"flex:1"}));
    // synced badge lives here in the editor toolbar
    const syncedStale=document.querySelector("#syncedBadge")?.classList.contains("stale");
    tabs.append(el("span",{class:"synced"+(syncedStale?" stale":""),id:"syncedBadge",
      title:"Click to save",style:"cursor:pointer",onclick:clickSave},
      syncedStale?"⟳ unsynced":"⟳ synced"));
    // preview-pane toggle
    const previewOff=localStorage.getItem("li_preview_off")==="1";
    tabs.append(el("button",{class:"small ghost",title:previewOff?"Show preview pane":"Hide preview pane",
      onclick:togglePreview},previewOff?"⊞ preview":"⊟ preview"));
    // chat-pane toggle
    tabs.append(el("button",{class:"small ghost",title:S.chatCollapsed?"Show chat":"Hide chat",
      onclick:toggleChat},S.chatCollapsed?"chat ❯":"chat ❮"));
    tabs.append(el("button",{class:"small ghost",title:"Open full-page preview in a new tab",onclick:()=>{
      if(S.bubble&&S.page) window.open("/api/bubbles/"+S.bubble+"/preview/"+S.page,"_blank");
    }},"🔍"));
  }
  async function savePage(){
    if(!S.editor||!S.page)return;
    await api("/api/bubbles/"+S.bubble+"/pages/"+S.page,
      {method:"PUT",body:JSON.stringify({content:S.editor.getMarkdown()})});
    S.lastPageMtime=null; S.remoteChangePending=false;
    markSynced(); toast("Page saved");
  }
  async function clickSave(){
    if(!S.editor||!S.page)return;
    if(S.remoteChangePending){
      const loadRemote=confirm(
        "The file was changed externally.\n\nOK = Load the remote version (your unsaved edits will be lost)\nCancel = Overwrite with your current edits");
      if(loadRemote){
        const c=(await api("/api/bubbles/"+S.bubble+"/pages/"+S.page)).content;
        S.editor.setMarkdown(c||"",false);
        S.lastPageMtime=null; S.remoteChangePending=false;
        markSynced(); setTimeout(updatePreview,150);
        return;
      }
    }
    await savePage();
  }
  async function switchPage(target){
    const match=S.pages.find(p=>p.page_slug===target)
      || S.pages.find(p=>p.title.toLowerCase()===String(target).toLowerCase());
    if(!match){ toast(`No page "${target}" in this bubble.`); return; }
    await savePage();
    const c=(await api("/api/bubbles/"+S.bubble+"/pages/"+match.page_slug)).content;
    S.page=match.page_slug; S.lastPageMtime=null; S.remoteChangePending=false;
    S.editor.setMarkdown(c||""); refreshTabs();
    setTimeout(updatePreview,150);
  }
  async function newPage(){
    const title=prompt("New page title:"); if(!title)return;
    await savePage();
    const ps=(await api("/api/bubbles/"+S.bubble+"/pages",{method:"POST",body:JSON.stringify({title})})).page_slug;
    S.pages.push({page_slug:ps,title}); S.page=ps; S.editor.setMarkdown("# "+title+"\n\n");
    refreshTabs();
  }
  async function deletePage(ps){
    if(!confirm("Delete this page?"))return;
    try{ await api("/api/bubbles/"+S.bubble+"/pages/"+ps,{method:"DELETE"}); }
    catch(e){ toast(e.message); return; }
    S.pages=S.pages.filter(p=>p.page_slug!==ps);
    if(S.page===ps){ S.page=S.home; const c=(await api("/api/bubbles/"+S.bubble+"/pages/"+S.home)).content;
      S.editor.setMarkdown(c||""); }
    refreshTabs(); setTimeout(updatePreview,150);
  }
  function markStale(){ const s=$("#syncedBadge"); if(s){s.classList.add("stale");s.textContent="⟳ unsynced";} }
  function markSynced(){ const s=$("#syncedBadge"); if(s){s.classList.remove("stale");s.textContent="⟳ synced";} }

  // ---- auto-sync polling (detects external file edits, e.g. from dev-mode) ----
  function stopPolling(){
    if(S.pollTimer){ clearInterval(S.pollTimer); S.pollTimer=null; }
    S.lastPageMtime=null; S.lastManifestMtime=null; S.remoteChangePending=false;
  }
  async function pollSync(){
    if(!S.bubble||!S.page)return;
    const bubble=S.bubble, page=S.page;
    try{
      const r=await api("/api/bubbles/"+bubble+"/poll?page="+page);
      if(S.bubble!==bubble||S.page!==page)return; // navigated away during await
      if(S.lastManifestMtime!==null&&r.manifest_mtime!==S.lastManifestMtime){
        S.pages=r.pages||[]; refreshTabs();
      }
      S.lastManifestMtime=r.manifest_mtime;
      if(S.lastPageMtime!==null&&r.page_mtime!==S.lastPageMtime){
        const stale=document.querySelector("#syncedBadge")?.classList.contains("stale");
        if(!stale&&S.editor){
          const c=(await api("/api/bubbles/"+bubble+"/pages/"+page)).content;
          if(S.bubble!==bubble||S.page!==page)return;
          S.editor.setMarkdown(c||"",false);
          S.remoteChangePending=false; setTimeout(updatePreview,150);
        } else if(stale){
          S.remoteChangePending=true;
          toast("File changed on disk — click ⟳ to save (you'll be asked about the remote version).");
        }
      }
      S.lastPageMtime=r.page_mtime;
    }catch(e){}
  }
  function startPolling(){
    stopPolling();
    S.pollTimer=setInterval(pollSync,5000);
  }

  function toggleChat(){
    const d=document.getElementById("detail"); if(!d)return;
    S.chatCollapsed=d.classList.toggle("chat-collapsed");
    localStorage.setItem("li_chat",S.chatCollapsed?"1":"0");
    refreshTabs();
  }
  function togglePreview(){
    if(!S.editor)return;
    const next=localStorage.getItem("li_preview_off")!=="1";
    localStorage.setItem("li_preview_off",next?"1":"0");
    if(S.previewEl){ S.previewEl.classList.toggle("hide",next); if(!next)updatePreview(); }
    refreshTabs();
  }
  // ---- read-only research chat pane ----
  function buildChatPane(right,b){
    right.append(el("div",{class:"hd"}, el("b",{},"Chat"),
      el("span",{class:"muted",style:"font-size:12px",id:"chatModelBadge"},S.model.active),
      el("span",{class:"spacer"}),
      el("span",{class:"muted",style:"font-size:11px",title:"This chat discusses your reports and papers but never edits pages."},"💬 read-only")));

    // Session selector + management
    const sessionSel=el("select",{id:"sessionSel"});
    sessionSel.append(el("option",{value:""},"✏️ New chat"));
    const sessCnt=el("span",{id:"sessCnt",class:"muted",style:"font-size:11px;white-space:nowrap"});
    const sessionsPanel=el("div",{id:"sessionsPanel",class:"sessions-panel hide"});
    const manageBtn=el("button",{class:"ghost small",title:"Manage all sessions",
      onclick:()=>sessionsPanel.classList.toggle("hide")},"📋");
    const sessionBar=el("div",{class:"sessionbar"},sessionSel,sessCnt,
      el("span",{class:"spacer"}), manageBtn,
      el("button",{class:"ghost small",style:"opacity:.5",title:"Delete this session",
        onclick:async()=>{
          if(!S.sessionId)return;
          if(!confirm("Delete this chat session?"))return;
          await api("/api/bubbles/"+S.bubble+"/chats/"+S.sessionId,{method:"DELETE"});
          S.sessionId=null; S.sessionTitle=null; S.chat=[]; chatlog.innerHTML="";
          await refreshSessionList(sessionSel); toast("Session deleted");
        }},"🗑"));
    right.append(sessionBar, sessionsPanel);

    sessionSel.onchange=async()=>{
      const id=sessionSel.value;
      if(!id){ S.sessionId=null; S.sessionTitle=null; S.chat=[]; chatlog.innerHTML=""; return; }
      const r=await api("/api/bubbles/"+S.bubble+"/chats/"+id);
      S.sessionId=id; S.sessionTitle=r.session.title||null; S.chat=r.session.messages||[];
      chatlog.innerHTML="";
      S.chat.forEach(m=>pushMsg(chatlog,m.role,m.content));
      chatlog.parentElement.scrollTop=1e9;
    };

    // Load session list asynchronously
    refreshSessionList(sessionSel);

    const log=el("div",{class:"bd"}); const chatlog=el("div",{id:"chatlog"}); log.append(chatlog);
    right.append(log);

    // deep-read pill selector
    right._deepIds=[];
    const drWrap=el("div",{class:"drwrap"});
    const pills=el("div",{class:"drpills"});
    const drRow=el("div",{class:"drrow"});
    const drSel=el("select"); drSel.append(el("option",{value:""},"📎 Add paper to deep-read…"));
    const refreshDrSel=()=>{
      drSel.innerHTML=""; drSel.append(el("option",{value:""},"📎 Add paper to deep-read…"));
      (b.assets||[]).filter(a=>!right._deepIds.includes(a.pdf_id))
        .forEach(a=>drSel.append(el("option",{value:a.pdf_id},a.title||a.pdf_id)));
    };
    const addPill=(a)=>{
      const pill=el("span",{class:"drpill"},a.title||a.pdf_id,
        el("span",{class:"x",onclick:()=>{ right._deepIds=right._deepIds.filter(id=>id!==a.pdf_id);
          pill.remove(); refreshDrSel(); }},"✕"));
      pills.append(pill);
    };
    drSel.onchange=()=>{ const pid=drSel.value; if(!pid)return;
      const a=(b.assets||[]).find(x=>x.pdf_id===pid); if(!a)return;
      right._deepIds.push(pid); addPill(a); refreshDrSel(); drSel.value=""; };
    if((b.assets||[]).length){ refreshDrSel(); drRow.append(drSel); drWrap.append(drRow,pills); right.append(drWrap); }

    const input=el("textarea",{rows:"2",id:"chatInput",
      placeholder:"Ask anything, or ask me to rewrite a section…"});
    const send=el("button",{class:"primary small",onclick:()=>sendChat(chatlog,input,right)},"Send");
    input.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat(chatlog,input,right);} };
    right.append(el("div",{class:"hd"},input,send));
  }

  async function refreshSessionList(sel){
    if(!S.bubble)return;
    try{
      const r=await api("/api/bubbles/"+S.bubble+"/chats");
      const cur=sel.value;
      while(sel.options.length>1)sel.remove(1);
      r.sessions.forEach(s=>sel.append(el("option",{value:s.id},s.title.slice(0,50)+(s.title.length>50?"…":""))));
      if([...sel.options].some(o=>o.value===cur))sel.value=cur;

      // Update count badge
      const cnt=document.getElementById("sessCnt");
      if(cnt)cnt.textContent=r.sessions.length?`(${r.sessions.length} saved)`:"";

      // Rebuild management panel
      const panel=document.getElementById("sessionsPanel");
      if(!panel)return;
      panel.innerHTML="";
      if(!r.sessions.length){
        panel.append(el("div",{style:"padding:8px 10px;font-size:12px;color:var(--muted)"},"No saved sessions."));
        return;
      }
      r.sessions.forEach(s=>{
        const chatlog=document.getElementById("chatlog");
        const row=el("div",{class:"session-row"},
          el("span",{class:"session-title",title:s.title},s.title),
          el("button",{class:"ghost small",title:"Delete",onclick:async()=>{
            if(!confirm("Delete '"+s.title.slice(0,40)+"'?"))return;
            await api("/api/bubbles/"+S.bubble+"/chats/"+s.id,{method:"DELETE"});
            if(S.sessionId===s.id){ S.sessionId=null; S.sessionTitle=null; S.chat=[]; if(chatlog)chatlog.innerHTML=""; }
            await refreshSessionList(sel); toast("Session deleted");
          }},"🗑"));
        panel.append(row);
      });
    }catch(e){}
  }

  function fallbackTitle(){
    return (S.chat.find(m=>m.role==="user")?.content||"New Chat").slice(0,40)||"New Chat";
  }
  async function fetchChatTitle(){
    // Ask the model for a short, cute name based on the conversation so far.
    try{
      const r=await api("/api/bubbles/"+S.bubble+"/chats/title",
        {method:"POST",body:JSON.stringify({messages:S.chat})});
      return (r.title||"").trim()||fallbackTitle();
    }catch(e){ return fallbackTitle(); }
  }
  async function autoSave(chatlog){
    if(!S.bubble||!S.chat.length)return;
    if(!S.sessionId){
      const d=new Date().toISOString().slice(0,19).replace(/[-:T]/g,'').slice(0,14);
      S.sessionId=d+"-"+Math.random().toString(36).slice(2,6);
    }
    // Generate the cute title once per session, then reuse it on later saves.
    if(!S.sessionTitle) S.sessionTitle=await fetchChatTitle();
    try{ await api("/api/bubbles/"+S.bubble+"/chats/"+S.sessionId,
      {method:"PUT",body:JSON.stringify({session_id:S.sessionId,title:S.sessionTitle,messages:S.chat})});
      // update the dropdown without losing current selection
      const sel=document.getElementById("sessionSel");
      if(sel) await refreshSessionList(sel);
    }catch(e){}
  }

  function pushMsg(chatlog,role,text){
    const m=el("div",{class:"msg "+role}); m.innerHTML=renderMarkdown(text);
    chatlog.append(m); chatlog.parentElement.scrollTop=1e9; return m;
  }

  // Hide raw <EDIT>/<NEWPAGE> XML during streaming; show subtle badges
  async function sendChat(chatlog,input,right){
    const text=input.value.trim(); if(!text)return; input.value="";
    S.chat.push({role:"user",content:text}); pushMsg(chatlog,"user",text);
    const page_context=S.editor?S.editor.getMarkdown():"";
    const deep=right._deepIds||[];
    const node=pushMsg(chatlog,"assistant",""); let acc="";
    streamPost("/api/bubbles/"+S.bubble+"/chat",
      {messages:S.chat,page:S.page,page_context,deep_read_ids:deep},
      ev=>{
        if(ev.type==="delta"){
          acc+=ev.text;
          node.innerHTML=renderMarkdown(acc);
          chatlog.parentElement.scrollTop=1e9;
        } else if(ev.type==="done"){
          S.chat.push({role:"assistant",content:ev.full_response||acc});
          node.innerHTML=renderMarkdown(ev.chat_text||acc);
          autoSave(chatlog);
        } else if(ev.type==="error"){
          node.innerHTML=renderMarkdown("⚠ "+ev.detail);
        }
      });
  }

  // ================= ATTENTION =================
  async function viewAttention(){
    const m=$("#main"); m.innerHTML=""; m.append(el("h2",{class:"section-title"},"🔔 Attention Queue"));
    const r=await api("/api/attention");
    if(!r.assets.length){ m.append(el("div",{class:"muted"},"Nothing needs your attention. 🎉")); return; }
    const grid=el("div",{class:"grid"});
    r.assets.forEach(a=>{
      const c=el("div",{class:"acard"});
      c.append(el("h4",{},a.title||a.filename||a.pdf_id));
      const tw=el("div",{}); (a.suggested_tags||[]).forEach(t=>tw.append(el("span",{class:"pill suggest"},t)));
      if(!(a.suggested_tags||[]).length)tw.append(el("span",{class:"muted"},"No suggestions — tag manually."));
      c.append(tw);
      c.append(el("div",{class:"row",style:"margin-top:10px"},
        el("button",{class:"primary small",onclick:async(e)=>{e.stopPropagation();
          const tagList=a.suggested_tags||[];
          await api("/api/assets/"+a.pdf_id,{method:"PATCH",body:JSON.stringify({tags:tagList,attention_flag:false})});
          for(const t of tagList){ await api("/api/bubbles",{method:"POST",body:JSON.stringify({name:t})}); }
          toast("Approved tags"); viewAttention(); refreshAttnCount();
        }},"✓ Approve tags"),
        el("button",{class:"small",onclick:(e)=>{e.stopPropagation();openAssetEditor(a);}},"Edit"),
        el("button",{class:"ghost small",onclick:async(e)=>{e.stopPropagation();
          await api("/api/assets/"+a.pdf_id,{method:"PATCH",body:JSON.stringify({attention_flag:false})});
          toast("Dismissed"); viewAttention(); refreshAttnCount();
        }},"Dismiss")));
      grid.append(c);
    });
    m.append(grid);
  }

  // go
  boot();
})();
</script>
</body>
</html>
