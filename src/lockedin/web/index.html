  // Render the "Papers in this bubble" strip. editMode shows a remove ✕ per paper plus a
  // picker of papers from other bubbles to add. Mutates b.assets in place on change so the
  // chat pane's deep-read selector (which closes over the same b.assets) stays in sync.
  async function renderBubblePdfs(container, b, editMode){
    if(!Array.isArray(b.assets)) b.assets=[];
    container.innerHTML="";
    const editBtn=el("button",{class:"ghost small",style:"padding:2px 9px;line-height:1",
      title:editMode?"Done editing papers":"Add or remove papers",
      onclick:()=>renderBubblePdfs(container,b,!editMode)}, editMode?"✓ Done":"✏️");
    container.append(el("div",{class:"row",style:"align-items:center;gap:6px"},
      el("b",{},"Papers in this bubble"),el("span",{class:"spacer"}),editBtn));

    const applied=(fresh)=>{ // sync b.assets in place, then re-render staying in edit mode
      b.assets.length=0; (fresh.assets||[]).forEach(a=>b.assets.push(a));
      renderBubblePdfs(container,b,true);
    };

    const list=el("div",{class:"bubble-pdf-list"});
    b.assets.forEach(a=>{
      // Each paper is a pressable pill linking to the PDF. The remove ✕ only shows in edit
      // mode so a stray click on the pill never accidentally un-tags the paper.
      const chip=el("a",{class:"paperchip",href:"/api/assets/"+a.pdf_id+"/pdf",
        target:"_blank",title:a.title||a.pdf_id},
        el("span",{class:"lbl"},a.title||a.pdf_id));
      if(editMode){
        chip.append(el("span",{class:"x",title:"Remove from this bubble",
          onclick:async(e)=>{
            e.preventDefault(); e.stopPropagation();   // don't open the PDF when removing
            if(!confirm('Remove "'+(a.title||a.pdf_id)+'" from this bubble?\n\nThe paper stays in your Assets and any other bubbles — it is only un-tagged here.'))return;
            try{ const r=await api("/api/bubbles/"+b.slug+"/remove-pdf",{method:"POST",body:JSON.stringify({pdf_id:a.pdf_id})});
              toast("Removed"); applied(r.bubble); }
            catch(e2){ toast("Error: "+e2.message); }
          }},"✕"));
      }
      list.append(chip);
    });
    if(!b.assets.length)list.append(el("div",{class:"muted"},"None yet — tag a PDF with this bubble."));
    container.append(list);

    if(!editMode)return;
    // add picker: papers from your other bubbles not already here
    const picker=el("div",{class:"col",
      style:"margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;gap:2px"});
    picker.append(el("div",{class:"muted",style:"font-size:12px"},"Loading other papers…"));
    container.append(picker);
    let all=[];
    try{ all=(await api("/api/assets")).assets||[]; }
    catch(e){ picker.innerHTML=""; picker.append(el("div",{class:"muted"},"Failed to load papers.")); return; }
    const have=new Set(b.assets.map(a=>a.pdf_id));
    const avail=all.filter(a=>!have.has(a.pdf_id));
    picker.innerHTML="";
    picker.append(el("div",{class:"muted",style:"font-size:12px"},
      avail.length?"Add a paper from your other bubbles:":"No other papers available to add."));
    avail.forEach(a=>{
      const hint=(a.tags||[]).length?"  ·  "+a.tags.join(", "):"";
      const row=el("div",{class:"truncate",style:"font-size:12px;cursor:pointer;padding:2px 0",
        title:(a.title||a.pdf_id)+hint},"＋ "+(a.title||a.pdf_id)+hint);
      row.onclick=async()=>{
        try{ const r=await api("/api/bubbles/"+b.slug+"/add-pdf",{method:"POST",body:JSON.stringify({pdf_id:a.pdf_id})});
          toast("Added to bubble"); applied(r.bubble); }
        catch(e){ toast("Error: "+e.message); }
      };
      picker.append(row);
    });
  }

  function initEditor(host, initialValue){
    S.editor=new toastui.Editor({
      el:host, height:"100%", theme:"dark", initialEditType:"markdown",
      previewStyle:"tab", initialValue, usageStatistics:false,
      autofocus:false,   // don't grab focus on load: it scrolls a long page's editor into
                         // view, which can scroll the whole document and hide the app
      toolbarItems:[['table','image','link']],   // undo/redo added below; everything else removed
      hooks:{ addImageBlobHook:(blob,cb)=>uploadImage(S.bubble,blob,cb) },
    });
    // Undo/redo toolbar buttons (the editor only ships keyboard shortcuts for these).
    const histBtn=(label,title,redo)=>{
      const b=document.createElement("button");
      b.type="button"; b.textContent=label; b.title=title;
      b.style.cssText="font:inherit;font-size:16px;line-height:1;background:none;border:none;color:inherit;cursor:pointer;margin:0;padding:0 2px";
      b.addEventListener("mousedown",e=>e.preventDefault());   // keep editor selection
      b.addEventListener("click",e=>{ e.preventDefault(); editorHistoryCmd(redo); });
      return b;
    };
    try{
      S.editor.insertToolbarItem({groupIndex:0,itemIndex:0},
        {name:"redo",tooltip:"Redo (Ctrl+Shift+Z)",el:histBtn("↷","Redo",true)});
      S.editor.insertToolbarItem({groupIndex:0,itemIndex:0},
        {name:"undo",tooltip:"Undo (Ctrl+Z)",el:histBtn("↶","Undo",false)});
    }catch(e){}
    // Ctrl/Cmd+S should save the page. The editor maps Mod-s to strikethrough, so we
    // catch the key in the capture phase (before it reaches the editor's keymap) and
    // save instead. Bound once on document; acts only while a report page is open.
    if(!S.ctrlSBound){
      S.ctrlSBound=true;
      document.addEventListener("keydown",e=>{
        if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==="s"||e.key==="S")){
          if(S.editor&&S.page){ e.preventDefault(); e.stopPropagation(); clickSave(); }
        }
      },true);
    }
    let deb;
    S.editor.on("change",()=>{
      if(S.applyingRemote)return;            // programmatic setMarkdown — not a user edit
      markStale(); scheduleAutosave();
      clearTimeout(deb); deb=setTimeout(updatePreview,300); });
    setTimeout(updatePreview,200);
    // The editor records the initial content load as an undoable step, so a stray
    // Ctrl+Z would wipe the whole page (and then autosave the wipe). Drop that step
    // once the content settles so undo can only reach back to the loaded baseline.
    setTimeout(resetEditorHistory,250);
  }

  // Trigger the editor's own undo/redo via its keymap (no public API for it otherwise).
  function editorHistoryCmd(redo){
    if(!S.editor)return;
    try{
      const me=S.editor.getCurrentModeEditor&&S.editor.getCurrentModeEditor();
      const dom=me&&me.view&&me.view.dom; if(!dom)return;
      try{ dom.focus({preventScroll:true}); }catch(e){ dom.focus(); }
      const MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||"");
      dom.dispatchEvent(new KeyboardEvent("keydown",{key:"z",code:"KeyZ",
        ctrlKey:!MAC, metaKey:MAC, shiftKey:!!redo, bubbles:true, cancelable:true}));
    }catch(e){}
  }

  // Clear the editor's undo history, keeping the current document as the new baseline.
  // Rebuilds the ProseMirror state with fresh plugins (its history plugin starts empty)
  // so there is nothing to undo past the loaded content.
  function resetEditorHistory(){
    if(!S.editor)return;
    try{
      const me=S.editor.getCurrentModeEditor&&S.editor.getCurrentModeEditor();
      const view=me&&me.view; if(!view)return;
      const state=view.state;
      const plugins=state.plugins.map(pl=>{
        const s=pl.getState&&pl.getState(state);
        return (s&&typeof s==="object"&&"done"in s&&"undone"in s) ? new pl.constructor(pl.spec) : pl;
      });
      view.updateState(state.constructor.create(
        {doc:state.doc, selection:state.selection, storedMarks:state.storedMarks, plugins}));
    }catch(e){}
  }

  function updatePreview(){
    if(!S.previewEl||!S.editor)return;
    S.previewEl.innerHTML=renderMarkdown(S.editor.getMarkdown(),{refs:S.refs,pageSlug:S.page});
    linkifyWikilinks(S.previewEl);
  }
  // Bubble-wide equation/theorem reference registry: numbers + labels are global, so \eqref and
  // \thmref resolve across pages. Re-fetched on bubble open, after every save, and after page
  // add/delete — then the preview re-renders with the updated numbering.
  async function fetchRefs(){
    const bubble=S.bubble; if(!bubble){ S.refs=null; return; }
    try{ const r=await api("/api/bubbles/"+bubble+"/refs"); if(S.bubble===bubble) S.refs=r; }
    catch(e){ if(S.bubble===bubble) S.refs=null; }
  }

  function uploadImage(slug,blob,cb){
    const fd=new FormData(); fd.append("file",blob,(blob.name||"figure.png"));
    fetch("/api/bubbles/"+slug+"/assets",{method:"POST",credentials:"include",body:fd})
      .then(r=>r.json()).then(d=>cb(d.url,"figure")).catch(()=>toast("Image upload failed"));
  }
  // Linkify both [[wikilinks]] (page nav) and @<id> TODO references (digits only, so @50 never
  // matches @5). A known @id renders as "@id title" linking to the TODO detail view; an unknown
  // id is left as literal text.
  function linkifyWikilinks(root){
    // Build slug→title lookup so links show the current page title, not the raw slug
    const slugTitle={};
    (S.pages||[]).forEach(p=>slugTitle[p.page_slug]=p.title);
    const RE=/\[\[([^\]]+)\]\]|@(\d+)/g;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    const targets=[]; let n; while(n=walker.nextNode()){ RE.lastIndex=0;
      // Skip text already inside a link, or inside code/pre (literal syntax must not resolve).
      if(RE.test(n.nodeValue) && !n.parentElement.closest("a,code,pre")) targets.push(n); }
    targets.forEach(node=>{
      const s=node.nodeValue, frag=document.createDocumentFragment(); let last=0,mm;
      RE.lastIndex=0;
      while(mm=RE.exec(s)){ if(mm.index>last)frag.append(s.slice(last,mm.index));
        if(mm[1]!=null){
          const raw=mm[1].trim();
          const pipe=raw.indexOf("|");
          const target=pipe===-1?raw:raw.slice(0,pipe).trim();
          const explicitLabel=pipe!==-1?raw.slice(pipe+1).trim():null;
          const label=explicitLabel||(slugTitle[target]||target);
          const a=document.createElement("a"); a.href="page:"+encodeURIComponent(target);
          a.textContent=label; a.className="wikilink"; frag.append(a);
        } else {
          const id=mm[2], todo=S.todosById[+id];
          if(!todo){ frag.append(mm[0]); }
          else {
            const a=document.createElement("a"); a.href="todo:"+id; a.className="todoref";
            a.textContent="@"+id+" "+todo.title;
            if(todo.done) a.style.textDecoration="line-through";
            frag.append(a);
          }
        }
        last=RE.lastIndex; }
      if(last<s.length)frag.append(s.slice(last));
      node.parentNode.replaceChild(frag,node);
    });
  }

  // ---- reverse sync (Overleaf-style): double-click rendered preview → jump editor cursor ----
  // Heuristic text match: the rendered HTML keeps no source positions, so we search the live
  // markdown for the double-clicked word (or, inside a rendered equation, its LaTeX) and move
  // the Toast UI cursor there. Good enough — lands on the right spot almost always.
  function _srcPosFromOffset(md,off){            // → 1-indexed [line, ch] for setSelection
    let line=1; for(let i=0;i<off;i++) if(md.charCodeAt(i)===10) line++;
    const ls=md.lastIndexOf("\n",off-1)+1;
    return [line, off-ls+1];
  }
  function _normTex(s){                            // compare TeX ignoring numbering + whitespace
    return (s||"").replace(/\\(?:tag|label)\{[^}]*\}/g,"").replace(/\s+/g,"").trim();
  }
  // Find where a rendered equation's LaTeX lives in the source. The KaTeX annotation carries the
  // retagged TeX (\tag{n}); the source still has \label{} — so we match on the normalized form.
  function _findMathOffset(md,tex){
    const needle=_normTex(tex); if(!needle) return -1;
    const res=[/\$\$([\s\S]+?)\$\$/g,
               /\\begin\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}([\s\S]*?)\\end\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}/g,
               /\\\[([\s\S]+?)\\\]/g, /\\\(([\s\S]+?)\\\)/g, /\$([^\$\n]+?)\$/g];
    for(const re of res){ let m; re.lastIndex=0;
      while((m=re.exec(md))!==null){ const n=_normTex(m[1]);
        if(n && (n===needle || n.includes(needle) || needle.includes(n))) return m.index; }
    }
    return -1;
  }
  // Find the double-clicked word in the source. When it occurs several times, disambiguate by how
  // many neighbouring words (from the clicked block) sit near each candidate in the source.
  function _stripMd(t){ return (t||"").replace(/[*_#>\[\]|`~]/g," "); }
  function _findWordOffset(md,word,context){
    const esc=word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp("\\b"+esc+"\\b","gi"); const hits=[]; let m;
    while((m=re.exec(md))!==null){ hits.push(m.index); if(hits.length>500) break; }
    if(!hits.length){ const i=md.toLowerCase().indexOf(word.toLowerCase()); return i; }
    if(hits.length===1 || !context) return hits[0];
    const neigh=_stripMd(context).toLowerCase().split(/\s+/)
      .filter(w=>w.length>2 && w.toLowerCase()!==word.toLowerCase()).slice(0,8);
    let best=hits[0],bestScore=-1;
    for(const off of hits){
      const around=_stripMd(md.slice(Math.max(0,off-60),off+60)).toLowerCase();
      let score=0; for(const w of neigh) if(around.includes(w)) score++;
      if(score>bestScore){ bestScore=score; best=off; }
    }
    return best;
  }
  function syncPreviewToSource(e){
    if(S.viewMode!=="split" || !S.editor || !S.editor.setSelection) return;
    let off=-1, matchLen=0;
    const mathEl=e.target.closest && e.target.closest(".katex");
    const md=S.editor.getMarkdown();
    if(mathEl){
      const ann=mathEl.querySelector('annotation[encoding="application/x-tex"]');
      off=_findMathOffset(md, ann?ann.textContent:"");
    } else {
      const word=(window.getSelection&&window.getSelection().toString().trim())||"";
      if(!word) return;
      const block=e.target.closest("p,li,h1,h2,h3,h4,h5,h6,td,th,blockquote,.math-env,div");
      off=_findWordOffset(md, word, block?block.textContent:"");
      if(off>=0) matchLen=word.length;
    }
    if(off<0) return;
    const [line,ch]=_srcPosFromOffset(md,off);
    // Moving the editor selection + focus can make the browser scroll the preview pane (its own
    // overflow:auto container) to a weird spot. The right pane must NOT move on a dblclick — so
    // snapshot its scroll and restore it, including after Toast UI's deferred focus scrollIntoView.
    const pv=S.previewEl, sTop=pv.scrollTop, sLeft=pv.scrollLeft;
    const keepPreview=()=>{ pv.scrollTop=sTop; pv.scrollLeft=sLeft; };
    try{ S.editor.setSelection([line,ch],[line,ch+matchLen]); S.editor.focus(); }
    catch(err){ console.warn("reverse-sync setSelection failed",err); }
    keepPreview(); requestAnimationFrame(keepPreview); setTimeout(keepPreview,30);
  }

  // ---- page tabs ----
  function refreshTabs(){
    const tabs=$("#ptabs"); if(!tabs)return; tabs.innerHTML="";
    const tabScroll=el("div",{class:"ptab-scroll"});
    const controls=el("div",{class:"ptab-controls"});
    tabScroll.onwheel=e=>{
      if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
      const max=tabScroll.scrollWidth-tabScroll.clientWidth;
      if(max<=0)return;
      const before=tabScroll.scrollLeft;
      tabScroll.scrollLeft+=e.deltaY;
      if(tabScroll.scrollLeft!==before)e.preventDefault();
    };
    tabs.append(tabScroll,controls);
    S.titleInputs={};
    S.pages.forEach(p=>{
      const t=el("div",{class:"ptab"+(p.page_slug===S.page?" active":"")});
      if(S.editingTitles){
        // In edit-titles mode each tab title becomes an input; "✓ Save titles" persists them.
        const inp=el("input",{value:p.title,class:"ptab-edit",
          onkeydown:e=>{if(e.key==="Enter")toggleEditTitles();if(e.key==="Escape")cancelEditTitles();}});
        S.titleInputs[p.page_slug]=inp;
        t.append(inp);
      } else {
        t.append(el("span",{onclick:()=>switchPage(p.page_slug)},p.title));
        if(p.page_slug!==S.home)
          t.append(el("span",{class:"x",title:"Delete page",onclick:(e)=>{e.stopPropagation();deletePage(p.page_slug);}},"✕"));
      }
      tabScroll.append(t);
    });
    if(!S.editingTitles) tabScroll.append(el("button",{class:"small ghost",onclick:newPage},"+ Page"));
    // sync badge lives here in the editor toolbar (state in S.syncState; autosaves on idle)
    const st=S.syncState||"synced";
    controls.append(el("span",{class:"synced "+st,id:"syncedBadge",
      title:st==="conflict"?"Changed on disk — click to resolve":"Saved automatically; click to save now",
      style:"cursor:pointer",onclick:clickSave},SYNC_LABEL[st]));
    // view-mode selector — also the home of "Edit titles" (folded in as a 4th option). Visible on
    // mobile too, so phones can switch between Read and Edit. Selecting "Edit titles" enters
    // rename mode (page titles + bubble name); picking any real view mode while renaming saves
    // those edits first, then switches. Enter inside a title input also saves (see toggleEditTitles).
    const vm=el("select",{class:"small ghost",title:"Page view mode",
      style:"width:auto;padding:4px 8px"+(S.editingTitles?";color:var(--accent);border-color:var(--accent)":"")});
    [["split","◧ Split"],["edit","✏️ Edit"],["view","👁 Read"],["edittitles","🏷️ Edit titles"]].forEach(([v,lbl])=>{
      const o=el("option",{value:v},lbl);
      if(v==="edittitles" ? S.editingTitles : (v===S.viewMode && !S.editingTitles)) o.selected=true;
      vm.append(o); });
    vm.onchange=async()=>{
      const v=vm.value;
      if(v==="edittitles"){ if(!S.editingTitles) toggleEditTitles(); return; }
      if(S.editingTitles) await toggleEditTitles();   // persist the in-progress title edits first
      setViewMode(v);
    };
    controls.append(vm);
    // chat-pane toggle
    controls.append(el("button",{class:"small ghost desktop-only-tool",title:S.chatCollapsed?"Show chat":"Hide chat",
      onclick:toggleChat},S.chatCollapsed?"💬 >":"💬 <"));
  }
  // ---- inline title editing: toggle page-title + bubble-name inputs from the sync-badge row ----
  function enterNameEdit(){
    if(!S.nameSpan)return;
    S.bubbleNameCurrent=S.nameSpan.textContent.replace(/\s*\(suggested\)$/,"").trim();
    S.nameInput=el("input",{value:S.bubbleNameCurrent,class:"ptab-edit",
      style:"font-size:18px;font-weight:600;width:auto;min-width:200px",
      onkeydown:e=>{if(e.key==="Enter")toggleEditTitles();if(e.key==="Escape")cancelEditTitles();}});
    S.nameSpan.replaceWith(S.nameInput);
  }
  function restoreName(){
    if(S.nameInput&&S.nameSpan){
      S.nameSpan.textContent=S.bubbleNameCurrent;
      S.nameInput.replaceWith(S.nameSpan); S.nameInput=null;
    }
  }
  function cancelEditTitles(){ S.editingTitles=false; restoreName(); refreshTabs(); }
  async function toggleEditTitles(){
    if(!S.editingTitles){
      S.editingTitles=true; enterNameEdit(); refreshTabs();
      const first=S.nameInput||Object.values(S.titleInputs)[0];
      if(first){ first.focus(); first.select(); }
      return;
    }
    // Exit edit mode: persist any changed bubble name + page titles, then re-render.
    S.editingTitles=false;
    if(S.nameInput){
      const val=S.nameInput.value.trim();
      if(val&&val!==S.bubbleNameCurrent){
        try{ await api("/api/bubbles/"+S.bubble,{method:"PATCH",body:JSON.stringify({name:val})});
          S.bubbleNameCurrent=val; toast("Renamed bubble"); }
        catch(e){ toast(e.message); }
      }
    }
    restoreName();
    for(const p of S.pages){
      const inp=S.titleInputs[p.page_slug]; if(!inp)continue;
      const val=inp.value.trim();
      if(val&&val!==p.title){
        try{ await api("/api/bubbles/"+S.bubble+"/pages/"+p.page_slug,
            {method:"PATCH",body:JSON.stringify({title:val})});
          p.title=val; }
        catch(e){ toast(e.message); }
      }
    }
    refreshTabs();
  }
  // ---- autosave (debounced) + optimistic-concurrency save ----
  const AUTOSAVE_MS=2500;
  function scheduleAutosave(){
    clearTimeout(S.autosaveTimer);
    S.autosaveTimer=setTimeout(()=>autosave(),AUTOSAVE_MS);
  }
  async function autosave(){
    if(!S.editor||!S.page)return;
    // Don't clobber an external edit: when a remote change is pending, stay in the
    // conflict state and wait for the user to resolve it by hand (click the badge).
    if(S.remoteChangePending){ markConflict(); return; }
    if(S.saving){ scheduleAutosave(); return; }       // a save is in flight; retry shortly
    // Safety net: never auto-persist a blank page. This is the last line of defense
    // against an accidental Ctrl+Z wiping content and the wipe being saved over it.
    // Emptying a page on purpose still works via an explicit Save (click the badge).
    if((S.editor.getMarkdown()||"").trim()===""){ markStale(); return; }
    await doSave({auto:true});
  }
  // The single write path. Sends the editor's content with the base mtime it was loaded
  // from; a 409 means the file changed underneath us -> flag a conflict, don't overwrite.
  async function doSave(opts={}){
    if(!S.editor||!S.page||S.saving)return false;
    const bubble=S.bubble, page=S.page, content=S.editor.getMarkdown();
    S.saving=true; markSaving();
    try{
      const r=await api("/api/bubbles/"+bubble+"/pages/"+page,
        {method:"PUT",body:JSON.stringify({content,base_mtime:S.baseMtime})});
      if(S.bubble!==bubble||S.page!==page)return true;   // navigated away mid-save
      S.baseMtime=r.page_mtime; S.lastPageMtime=r.page_mtime; S.remoteChangePending=false;
      // Only declare "synced" if nothing was typed while the request was in flight.
      if(content===S.editor.getMarkdown())markSynced(); else scheduleAutosave();
      if(!opts.auto)toast("Page saved");
      fetchRefs().then(()=>updatePreview());   // pick up labels/numbers added on this save
      return true;
    }catch(e){
      if(S.bubble===bubble&&S.page===page){
        if(e.status===409){
          S.remoteChangePending=true; markConflict();
          if(!opts.auto)toast("File changed on disk — click ⟳ to resolve.");
        } else { markStale(); if(!opts.auto)toast("Save failed: "+e.message); }
      }
      return false;
    }finally{ S.saving=false; }
  }
  // Flush any pending edits synchronously-ish (used before navigating to another page).
  async function savePage(){
    clearTimeout(S.autosaveTimer);
    if(S.editor&&S.page&&S.syncState!=="synced"&&!S.remoteChangePending) await doSave({});
  }
  async function clickSave(){
    if(!S.editor||!S.page)return;
    clearTimeout(S.autosaveTimer);
    if(S.remoteChangePending){
      const loadRemote=confirm(
        "The file was changed externally.\n\nOK = Load the remote version (your unsaved edits will be lost)\nCancel = Overwrite with your current edits");
      if(loadRemote){
        const c=(await api("/api/bubbles/"+S.bubble+"/pages/"+S.page)).content;
        applyRemote(c||""); await primeSync();
        S.remoteChangePending=false; markSynced();
        return;
      }
      // Overwrite: drop the stale base so the precondition passes, then write.
      S.baseMtime=null; S.remoteChangePending=false;
    }
    await doSave({});
  }
  // Capture the current on-disk mtime as our base, without diffing (used after a load).
  async function primeSync(){
    if(!S.bubble||!S.page)return;
    const bubble=S.bubble, page=S.page;
    try{
      const r=await api("/api/bubbles/"+bubble+"/poll?page="+page);
      if(S.bubble!==bubble||S.page!==page)return;
      S.baseMtime=r.page_mtime; S.lastPageMtime=r.page_mtime; S.lastManifestMtime=r.manifest_mtime;
    }catch(e){}
  }
  // Scroll the editor and preview panes back to the top. Called on page navigation so a
  // new page never inherits the previous page's scroll offset (which would otherwise leave
  // a short page scrolled past its content, showing blank). Heavy pages (lots of KaTeX) can
  // finish laying out — and Toast UI's editor/preview scroll-sync can re-fire — well after the
  // switch, so we re-apply across several frames and a long tail rather than just once.
  function scrollContentTop(){
    const apply=()=>{
      try{ if(S.editor&&S.editor.setScrollTop) S.editor.setScrollTop(0); }catch(e){}
      if(S.previewEl) S.previewEl.scrollTop=0;
      // If the editor grabbed focus on a long page it can scroll the whole document, pushing
      // the fixed-height app off the top of the viewport (a black void). Force the page back.
      if(window.scrollX||window.scrollY) window.scrollTo(0,0);
      if(document.scrollingElement) document.scrollingElement.scrollTop=0;
    };
    apply();
    requestAnimationFrame(apply);
    [120,300,600].forEach(ms=>setTimeout(apply,ms));
  }
  // Set editor content without it counting as a user edit (suppresses the change hook).
  function applyRemote(md){
    S.applyingRemote=true;
    try{ S.editor.setMarkdown(md||"",false); }
    finally{ setTimeout(()=>{ S.applyingRemote=false; },0); }
    setTimeout(updatePreview,150);
    setTimeout(resetEditorHistory,200);   // loaded content is the undo baseline (see initEditor)
  }
  async function switchPage(target,{noRoute=false}={}){
    const match=S.pages.find(p=>p.page_slug===target)
      || S.pages.find(p=>p.title.toLowerCase()===String(target).toLowerCase());
    if(!match){ toast(`No page "${target}" in this bubble.`); return; }
    await savePage();
    const c=(await api("/api/bubbles/"+S.bubble+"/pages/"+match.page_slug)).content;
    S.page=match.page_slug; S.remoteChangePending=false;
    if(!noRoute)pushRoute("bubble/"+S.bubble+"/"+S.page);   // keep the page across refresh
    applyRemote(c||""); markSynced(); refreshTabs();
    scrollContentTop();                                     // start the new page at the top
    primeSync();
  }
  async function newPage(){
    const title=prompt("New page title:"); if(!title)return;
    await savePage();
    const ps=(await api("/api/bubbles/"+S.bubble+"/pages",{method:"POST",body:JSON.stringify({title})})).page_slug;
    S.pages.push({page_slug:ps,title}); S.page=ps; S.remoteChangePending=false;
    pushRoute("bubble/"+S.bubble+"/"+S.page);
    await primeSync();                          // base off the just-created file
    S.editor.setMarkdown("# "+title+"\n\n");    // a real edit -> autosaves on idle
    setTimeout(resetEditorHistory,200);         // don't let Ctrl+Z wipe the new page
    refreshTabs(); fetchRefs().then(()=>updatePreview());   // page set changed → renumber
  }
  async function deletePage(ps){
    if(!confirm("Delete this page?"))return;
    try{ await api("/api/bubbles/"+S.bubble+"/pages/"+ps,{method:"DELETE"}); }
    catch(e){ toast(e.message); return; }
    S.pages=S.pages.filter(p=>p.page_slug!==ps);
    if(S.page===ps){ S.page=S.home; S.remoteChangePending=false;
      pushRoute("bubble/"+S.bubble);
      const c=(await api("/api/bubbles/"+S.bubble+"/pages/"+S.home)).content;
      applyRemote(c||""); markSynced(); scrollContentTop(); primeSync(); }
    refreshTabs(); fetchRefs().then(()=>updatePreview());   // page removed → renumber
  }
  const SYNC_LABEL={synced:"⟳ synced",stale:"✎ unsaved",saving:"⟳ saving…",conflict:"⚠ unsynced"};
  function setSync(state){
    S.syncState=state;
    const s=$("#syncedBadge");
    if(s){ s.className="synced "+state; s.textContent=SYNC_LABEL[state];
      s.title=state==="conflict"?"Changed on disk — click to resolve":"Saved automatically; click to save now"; }
  }
  function markStale(){ if(S.syncState!=="conflict")setSync("stale"); }  // keep conflict sticky
  function markSaving(){ setSync("saving"); }
  function markSynced(){ setSync("synced"); }
  function markConflict(){ setSync("conflict"); }

  // ---- auto-sync polling (detects external file edits, e.g. from dev-mode) ----
  function stopPolling(){
    if(S.pollTimer){ clearInterval(S.pollTimer); S.pollTimer=null; }
    clearTimeout(S.autosaveTimer); S.autosaveTimer=null;
    S.lastPageMtime=null; S.lastManifestMtime=null; S.remoteChangePending=false;
    S.baseMtime=null; S.saving=false; S.syncState="synced";
  }
  async function pollSync(){
    if(!S.bubble||!S.page)return;
    if(S.editingTitles)return;   // don't re-render tabs (wiping title inputs) mid-edit
    const bubble=S.bubble, page=S.page;
    try{
      const r=await api("/api/bubbles/"+bubble+"/poll?page="+page);
      if(S.bubble!==bubble||S.page!==page)return; // navigated away during await
      if(S.lastManifestMtime!==null&&r.manifest_mtime!==S.lastManifestMtime){
        S.pages=r.pages||[]; refreshTabs();
      }
      S.lastManifestMtime=r.manifest_mtime;
      if(S.lastPageMtime!==null&&r.page_mtime!==S.lastPageMtime){
        if(S.saving){
          /* our own write is in flight — not an external edit; doSave reconciles mtime */
        } else if(S.syncState==="synced"&&S.editor){
          // editor is clean — safe to pull the external edit in automatically
          const c=(await api("/api/bubbles/"+bubble+"/pages/"+page)).content;
          if(S.bubble!==bubble||S.page!==page)return;
          applyRemote(c||""); S.baseMtime=r.page_mtime; S.remoteChangePending=false;
        } else {
          // unsaved local edits + an external edit -> conflict; user resolves by hand
          S.remoteChangePending=true; markConflict();
          toast("File changed on disk — click ⟳ to save (you'll be asked about the remote version).");
        }
      }
      S.lastPageMtime=r.page_mtime;
    }catch(e){}
  }
  function startPolling(){
    stopPolling();
    S.pollTimer=setInterval(pollSync,5000);
  }

  function toggleChat(){

  // Per-bubble view mode, remembered across page refreshes (localStorage). Falls back to the

  async function refreshSessionList(sel){
    if(!S.bubble)return;
    try{
      const r=await api("/api/bubbles/"+S.bubble+"/chats");
      const cur=sel.value;
      while(sel.options.length>1)sel.remove(1);
      r.sessions.forEach(s=>sel.append(el("option",{value:s.id},s.title.slice(0,50)+(s.title.length>50?"…":""))));
      if([...sel.options].some(o=>o.value===cur))sel.value=cur;

      // Update count badge
      const cnt=document.getElementById("sessCnt");
      if(cnt)cnt.textContent=r.sessions.length?`(${r.sessions.length} saved)`:"";

      // Rebuild management panel
      const panel=document.getElementById("sessionsPanel");
      if(!panel)return;
      panel.innerHTML="";
      if(!r.sessions.length){
        panel.append(el("div",{style:"padding:8px 10px;font-size:12px;color:var(--muted)"},"No saved sessions."));
        return;
      }
      r.sessions.forEach(s=>{
        const chatlog=document.getElementById("chatlog");
        const row=el("div",{class:"session-row"},
          el("span",{class:"session-title",title:s.title},s.title),
          el("button",{class:"ghost small",title:"Delete",onclick:async()=>{
            if(!confirm("Delete '"+s.title.slice(0,40)+"'?"))return;
            await api("/api/bubbles/"+S.bubble+"/chats/"+s.id,{method:"DELETE"});
            if(S.sessionId===s.id){ S.sessionId=null; S.sessionTitle=null; S.chat=[]; if(chatlog)chatlog.innerHTML=""; }
            await refreshSessionList(sel); toast("Session deleted");
          }},"🗑"));

  async function autoSave(chatlog){

      S.sessionId=d+"-"+Math.random().toString(36).slice(2,6);
    }

      {method:"PUT",body:JSON.stringify({session_id:S.sessionId,title:S.sessionTitle,messages:S.chat})});

  function pushMsg(chatlog,role,text){
    const m=el("div",{class:"msg "+role}); m.innerHTML=renderMarkdown(text);

  // Hide raw <EDIT>/<NEWPAGE> XML during streaming; show subtle badges
  async function sendChat(chatlog,input,right){
    const text=input.value.trim(); if(!text)return; input.value="";
    S.chat.push({role:"user",content:text}); pushMsg(chatlog,"user",text);
    const page_context=S.editor?S.editor.getMarkdown():"";
    const deep=right._deepIds||[];
    const node=pushMsg(chatlog,"assistant",""); let acc="";
    streamPost("/api/bubbles/"+S.bubble+"/chat",
      {messages:S.chat,page:S.page,page_context,deep_read_ids:deep},
      ev=>{
        if(ev.type==="delta"){
          acc+=ev.text;
          node.innerHTML=renderMarkdown(acc);
          chatlog.parentElement.scrollTop=1e9;
        } else if(ev.type==="done"){
          S.chat.push({role:"assistant",content:ev.full_response||acc});
          node.innerHTML=renderMarkdown(ev.chat_text||acc);
          autoSave(chatlog);
        } else if(ev.type==="error"){
          node.innerHTML=renderMarkdown("⚠ "+ev.detail);
        }
      });
  }

    const items=r.items||[];
    S.newsEmpty=el("div",{class:"muted"},
      "No papers yet. Start a crawl below — found papers appear here, grouped by bubble.");
    if(!items.length){ feed.append(S.newsEmpty); return; }
    const groups={}; items.forEach(it=>{ const k=it.bubble_slug||""; (groups[k]=groups[k]||[]).push(it); });
    Object.keys(groups).sort((a,b)=> a===""?1 : b===""?-1 :
      (S.newsBubbleNames[a]||a).localeCompare(S.newsBubbleNames[b]||b))
      .forEach(slug=>{ const grid=_newsGroupGrid(slug); groups[slug].forEach(it=>grid.append(newsCard(it))); });
  }
  function _newsGroupGrid(slug){
    if(S.newsGroups[slug]) return S.newsGroups[slug];
    if(S.newsEmpty){ S.newsEmpty.remove(); S.newsEmpty=null; }
    const label=slug?(S.newsBubbleNames[slug]||slug):"Other / unmatched";
    const grid=el("div",{class:"grid"});
    S.newsFeed.append(el("h3",{class:"section-title",style:"font-size:15px;margin:14px 0 8px"},"🫧 "+label), grid);
    S.newsGroups[slug]=grid; return grid;
  }
  function newsFeedInsert(it){ _newsGroupGrid(it.bubble_slug||"").prepend(newsCard(it)); updateNewsTitle(); }

  // tear down any in-page crawl stream/poller (the server crawl keeps running + persisting)
  function stopNewsLive(){
    if(S.newsAbort){ try{S.newsAbort.abort();}catch(e){} S.newsAbort=null; }
    if(S.newsPoll){ clearTimeout(S.newsPoll); S.newsPoll=null; }
    S.newsStreaming=false; S.newsBusy=false;
  }
  async function viewNews(){
    stopNewsLive();
    const m=$("#main"); m.innerHTML=""; S._nf=0; S.newsBusy=false;
    const title=el("h2",{class:"section-title",style:"margin:0"},"📰 News"); S.newsTitle=title;
    m.append(el("div",{class:"row"}, title,
      el("span",{class:"spacer"}),
      el("button",{class:"ghost small",onclick:openNewsHistory},"🕘 History"),
      el("button",{class:"ghost small",onclick:openNewsSettings},"⚙ Instructions")));
    const feed=el("div",{style:"max-height:42vh;overflow:auto;border:1px solid var(--line);"+
      "border-radius:10px;padding:10px 12px;margin-top:10px"});
    const chatWrap=el("div",{class:"col",style:"margin-top:12px;border:1px solid var(--line);"+
      "border-radius:10px;padding:10px 12px;gap:8px"});
    m.append(feed, chatWrap);
    let r={items:[],bubbles:[]}, st={};
    try{ r=await api("/api/news"); }catch(e){}
    try{ st=await api("/api/news/status"); }catch(e){}
    renderNewsFeed(feed, r);
    updateNewsTitle();
    buildNewsChat(chatWrap, st);
  }

  // render one transcript entry; "activity" = a muted step line, else a normal chat bubble
  function pushNewsMsg(log, role, text){
    if(role==="activity"){
      const d=el("div",{class:"muted",style:"font-size:12px;font-style:italic;margin:1px 0"},text);
      log.append(d); log.parentElement.scrollTop=1e9; return d;
    }
    return pushMsg(log, role, text);
  }
  function newsSend(chatlog, message, opts, onActive){
    if(S.newsBusy)return;
    if(message)pushMsg(chatlog,"user",message);
    S.newsBusy=true; S.newsStreaming=true;
    let node=null, acc="";                 // current assistant bubble; reset after each step
    S.newsAbort=streamPost("/api/news/chat", {message:message||"", ...(opts||{})}, ev=>{
      if(ev.type==="activity"){ pushNewsMsg(chatlog,"activity",ev.text); node=null; acc=""; }
      else if(ev.type==="delta"){
        if(!node){ node=pushMsg(chatlog,"assistant",""); acc=""; }
        acc+=ev.text; node.innerHTML=renderMarkdown(acc); chatlog.parentElement.scrollTop=1e9;
      }
      else if(ev.type==="item"){
        newsFeedInsert(ev.item);
        pushNewsMsg(chatlog,"activity","➕ added: "+(ev.item.title||ev.item.url||"")); node=null; acc="";
        S._nf=(S._nf||0)+1; if(S.newsFoundLabel)S.newsFoundLabel.textContent="+"+S._nf+" found";
        refreshNewsCount();
      }
      else if(ev.type==="done"){
        S.newsBusy=false; S.newsStreaming=false; S.newsAbort=null;
        let summary="";
        if(ev.text) summary=ev.text;
        else if(ev.stopped==="timeout") summary="⏱ Stopped (timed out) — found "+ev.added+
          " this turn; there may be more. Type “continue” or hit ▶ Continue.";
        else if(ev.stopped==="max_turns") summary="⏱ Hit the step limit — found "+ev.added+
          "; there may be more. Type “continue”.";
        if(summary)pushMsg(chatlog,"assistant",summary);
        if(!ev.accepted && (ev.tokens||ev.cost_usd))
          pushNewsMsg(chatlog,"activity","≈ "+(ev.tokens||0).toLocaleString()+" tokens · ~$"+
            (ev.cost_usd||0).toFixed(4)+" this turn");
        refreshNewsCount();
        if(ev.accepted){ onActive&&onActive(false,0,0); }
        else { onActive&&onActive(true, ev.cost_usd||0, ev.tokens||0); }
      }
      else if(ev.type==="error"){ S.newsBusy=false; S.newsStreaming=false; S.newsAbort=null;
        pushMsg(chatlog,"assistant","⚠ "+ev.detail); }
    });
  }

  async function buildNewsChat(wrap, st){
    wrap.innerHTML="";
    const sess=st.session||null; let active=!!sess;
    // a crawl is running server-side but this page isn't the one streaming it → reconnect by polling
    let reconnecting=active && !!sess.running && !S.newsStreaming;
    let sessionCost=active?(sess.cost_usd||0):0;
    let sessionTokens=active?(sess.tokens||0):0;
    let models=[]; try{ models=(await api("/api/news/models")).models||[]; }catch(e){}
    const estById={}; const modelSel=el("select",{style:"width:auto"});
    models.forEach(mo=>{ estById[mo.id]=mo.est_usd; modelSel.append(el("option",{value:mo.id},mo.label)); });
    if(active&&sess.model)modelSel.value=sess.model;
    const est=el("span",{class:"muted",style:"font-size:12px"});
    const since=el("input",{type:"date",style:"width:auto"});
    const until=el("input",{type:"date",style:"width:auto"});
    since.value=(active?sess.since:st.default_since)||""; until.value=(active?sess.until:st.today)||"";
    const found=el("span",{class:"muted",style:"font-size:12px"}); S.newsFoundLabel=found;
    if(S._nf)found.textContent="+"+S._nf+" found";
    wrap.append(el("div",{class:"row",style:"flex-wrap:wrap;gap:8px;align-items:center"},
      el("span",{class:"muted",style:"font-size:12px"},"Model"),modelSel,est,
      el("span",{class:"muted",style:"font-size:12px;margin-left:6px"},"Range"),since,
      el("span",{class:"muted",style:"font-size:12px"},"→"),until,
      el("span",{class:"spacer"}),found));
    const scroller=el("div",{style:"min-height:200px;max-height:34vh;overflow:auto;"+
      "border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0"});
    const chatlog=el("div",{class:"col",style:"gap:8px"}); scroller.append(chatlog); wrap.append(scroller);
    if(active&&(sess.messages||[]).length) sess.messages.forEach(mm=>pushNewsMsg(chatlog,mm.role,mm.text));
    else if(!active) pushMsg(chatlog,"assistant","Hit **🚀 Go!** to crawl using your saved "+
      "instructions — I’ll stream papers into the feed above as I find them. Then say "+
      "**continue** for more, steer me (e.g. *“focus on diffusion”*), or **✓ I’m happy** to "+
      "save and move your date pointer. (You can also type guidance before starting.)");
    const ta=el("textarea",{rows:"2",style:"flex:1"});
    const send=()=>{ const t=ta.value.trim(); if(!t)return; ta.value="";
      newsSend(chatlog,t, active?{}:{model:modelSel.value,since:since.value,until:until.value}, onActive); };
    ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} };
    wrap.append(el("div",{class:"row",style:"gap:8px;align-items:flex-end"},ta,
      el("button",{class:"primary",onclick:send},"Send")));
    const go=el("button",{class:"primary",onclick:()=>{ if(S.newsBusy)return;
      newsSend(chatlog,"",{model:modelSel.value,since:since.value,until:until.value},onActive); }},"🚀 Go!");
    const cont=el("button",{class:"small",onclick:()=>newsSend(chatlog,"continue",{},onActive)},"▶ Continue");
    const happy=el("button",{class:"small",onclick:async()=>{ if(S.newsBusy)return;
      try{ const res=await api("/api/news/accept",{method:"POST"});
        pushMsg(chatlog,"assistant","Saved — moved your date pointer to "+(res.pointer||"today")+" ✓");
        toast("Saved & advanced"); onActive(false,0,0); refreshNewsCount(); }
      catch(e){ toast("Error: "+e.message); } }},"✓ I'm happy");
    const discard=el("button",{class:"ghost small",onclick:async()=>{ if(S.newsStreaming)return;
      if(!confirm("Discard this crawl batch? Papers found this session are removed; the date pointer stays put."))return;
      try{ await api("/api/news/discard",{method:"POST"}); toast("Discarded"); viewNews(); }
      catch(e){ toast("Error: "+e.message); } }},"✕ Discard");
    const idleHint=el("span",{class:"muted",style:"font-size:12px"},
      "Uses your saved instructions — no need to type. Or add guidance above first.");
    const spinner=el("span",{class:"muted",style:"font-size:12px;font-style:italic"},
      "⏳ crawl in progress… (you can leave this page — it keeps running)");
    const actions=el("div",{class:"row",style:"gap:8px;align-items:center"}); wrap.append(actions);
    function refreshControls(){
      modelSel.disabled=active; since.disabled=active; until.disabled=active;
      ta.disabled=reconnecting;
      est.textContent = active
        ? (modelSel.value+" · $"+sessionCost.toFixed(2)+" · "+sessionTokens.toLocaleString()+" tok so far")
        : (estById[modelSel.value]!=null?("~$"+estById[modelSel.value].toFixed(2)+"/turn"):"");
      ta.placeholder = reconnecting?"Crawling… please wait"
        : (active?"Reply… (e.g. “continue”, “focus on diffusion”)":"Optional guidance, then 🚀 Go! (or Send)");
      actions.innerHTML="";
      if(reconnecting) actions.append(spinner, el("span",{class:"spacer"}), discard);
      else if(active) actions.append(cont,happy,el("span",{class:"spacer"}),discard);
      else actions.append(go, idleHint);
    }
    function onActive(isActive, costDelta, tokensDelta){ active=isActive; reconnecting=false;
      sessionCost+=(costDelta||0); sessionTokens+=(tokensDelta||0);
      if(!isActive){ sessionCost=0; sessionTokens=0; } refreshControls(); }
    refreshControls();

    // reconnect: poll for new transcript lines + items until the running turn ends
    if(reconnecting){
      S.newsBusy=true;
      let shown=(sess.messages||[]).length;
      const poll=async()=>{
        if(S.view!=="news"){ return; }
        let s=null; try{ s=(await api("/api/news/status")).session; }catch(e){}
        try{ const rr=await api("/api/news"); renderNewsFeed(S.newsFeed, rr); updateNewsTitle(); }catch(e){}
        if(!s || !s.running){ viewNews(); return; }   // finished → rebuild shows final state + controls
        const msgs=s.messages||[];
        for(let i=shown;i<msgs.length;i++) pushNewsMsg(chatlog,msgs[i].role,msgs[i].text);
        shown=msgs.length;
        S.newsPoll=setTimeout(poll,4000);
      };
      S.newsPoll=setTimeout(poll,3000);
    }
  }
  async function openNewsHistory(){
    let list; try{ list=(await api("/api/news/chats")).chats||[]; }
    catch(e){ toast("Error: "+e.message); return; }
    const overlay=el("div",{class:"overlay"}); const close=()=>overlay.remove();
    const box=el("div",{class:"diffbox col",
      style:"width:min(640px,95vw);padding:18px;gap:10px;max-height:88vh;overflow:auto"});
    function showList(){
      box.innerHTML="";
      box.append(el("div",{class:"row"},el("b",{},"🕘 Past crawls"),el("span",{class:"spacer"}),
        el("button",{class:"ghost small",onclick:close},"✕")));
      if(!list.length){ box.append(el("div",{class:"muted",style:"font-size:12px"},
        "No past crawls yet. Conversations are saved here when you Save or Discard a crawl.")); return; }
      list.forEach(s=>{
        const meta=`${(s.created_at||"").slice(0,10)} · ${s.model||""} · ${s.n_items||0} paper(s)`;
        const info=el("div",{class:"col",style:"flex:1;gap:2px;cursor:pointer;min-width:0",
          onclick:()=>showOne(s.id)},
          el("div",{class:"truncate"},s.title||"Crawl"),
          el("div",{class:"muted",style:"font-size:11px"},meta));
        const del=el("button",{class:"ghost small",title:"Delete",onclick:async()=>{
          if(!confirm("Delete this saved crawl chat?"))return;
          try{ await api("/api/news/chats/"+s.id,{method:"DELETE"});
            list=list.filter(x=>x.id!==s.id); showList(); }catch(e){ toast("Error: "+e.message); } }},"🗑");
        box.append(el("div",{class:"row",style:"align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px"},
          info, el("button",{class:"small",onclick:()=>showOne(s.id)},"View"), del));
      });
    }
    async function showOne(id){
      let rec; try{ rec=(await api("/api/news/chats/"+id)).chat; }
      catch(e){ toast("Error: "+e.message); return; }
      box.innerHTML="";
      box.append(el("div",{class:"row"},el("button",{class:"ghost small",onclick:showList},"← Back"),
        el("span",{class:"spacer"}),el("button",{class:"ghost small",onclick:close},"✕")));
      box.append(el("div",{class:"muted",style:"font-size:12px"},
        `${rec.title||"Crawl"} · ${(rec.created_at||"").slice(0,10)} · ${rec.model||""} · `+
        `range ${rec.since||"?"}→${rec.until||"?"} · ${rec.n_items||0} paper(s) · `+
        `~$${(rec.cost_usd||0).toFixed(4)} · ${(rec.tokens||0).toLocaleString()} tok`));
      const log=el("div",{class:"col",style:"gap:8px;max-height:62vh;overflow:auto"});
      (rec.messages||[]).forEach(mm=>pushNewsMsg(log,mm.role,mm.text||""));
      box.append(log);
    }
    showList(); overlay.append(box);
    overlay.onclick=e=>{ if(e.target===overlay)close(); }; document.body.append(overlay);
  }
  async function openNewsSettings(){
    let list; try{ list=(await api("/api/news/instructions")).instructions||[]; }
    catch(e){ toast("Error: "+e.message); return; }
    const data=list.map(i=>({id:i.id,text:i.text,enabled:i.enabled!==false}));
    const overlay=el("div",{class:"overlay"});
    const close=()=>overlay.remove();
    const rows=el("div",{class:"col",style:"gap:8px"});
    function renderRows(){
      rows.innerHTML="";
      data.forEach((it,idx)=>{
        const cb=el("input",{type:"checkbox",style:"width:auto;flex:0 0 auto;margin:0"}); cb.checked=it.enabled!==false;
        cb.onchange=()=>{ it.enabled=cb.checked; };
        const txt=el("input",{value:it.text||"",placeholder:"monitor …",style:"flex:1"});
        txt.oninput=()=>{ it.text=txt.value; };
        const del=el("button",{class:"ghost small",title:"Remove",
          onclick:()=>{ data.splice(idx,1); renderRows(); }},"🗑");
        rows.append(el("div",{class:"row",style:"align-items:center;gap:8px"},cb,txt,del));
      });
      if(!data.length)rows.append(el("div",{class:"muted",style:"font-size:12px"},"No instructions yet."));
    }
    renderRows();
    const box=el("div",{class:"diffbox col",
      style:"width:min(560px,95vw);padding:18px;gap:10px;max-height:88vh;overflow:auto"},
      el("div",{class:"row"},el("b",{},"📰 News instructions"),el("span",{class:"spacer"}),
        el("button",{class:"ghost small",onclick:close},"✕")),
      el("div",{class:"muted",style:"font-size:12px"},
        "Plain-English things to monitor — e.g. “monitor arXiv cs.LG for diffusion papers” or "+
        "“watch <person>’s blog”. These are just text; the date range for a crawl is set in the "+
        "chat (it defaults to your last saved point → today)."),
      rows,
      el("div",{class:"row",style:"margin-top:4px"},
        el("button",{class:"ghost small",
          onclick:()=>{ data.push({text:"",enabled:true}); renderRows(); }},"+ Add instruction"),
        el("span",{class:"spacer"}),
        el("button",{class:"primary",onclick:async()=>{
          const payload=data.map(it=>({id:it.id,text:(it.text||"").trim(),
            enabled:it.enabled!==false}))
            .filter(it=>it.text);
          try{ await api("/api/news/instructions",{method:"PUT",body:JSON.stringify({instructions:payload})});
            toast("Saved"); close(); }
          catch(e){ toast("Error: "+e.message); }
        }},"Save")));
    overlay.append(box);
    overlay.onclick=e=>{ if(e.target===overlay)close(); };
    document.body.append(overlay);
  }

  // go
  boot();
})();
</script>
