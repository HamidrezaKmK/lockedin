<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lockedin — research assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
<!-- Toast UI Editor: Notion-like markdown editor (markdown stays source of truth) -->
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css">
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<style>
  :root{
    --bg:#0d1018; --panel:#161b25; --panel2:#1c2230; --line:#252d3d;
    --ink:#e8ecf4; --muted:#8a94a8; --accent:#9b80ff; --accent2:#4dd9b8;
    --warn:#f5c842; --bad:#ff6b6b; --good:#4ade80; --radius:12px;
    --vvh:100vh;
    --font-ui:'Syne',system-ui,sans-serif;
    --font-reading:'Source Serif 4',Georgia,serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --shadow-sm:0 1px 6px rgba(0,0,0,.4);
    --shadow:0 6px 24px rgba(0,0,0,.55);
    --glow:0 0 0 1px var(--accent);
  }
  /* Light mode */
  body.light{
    --bg:#f2f4f8; --panel:#ffffff; --panel2:#edf0f7; --line:#d4daea;
    --ink:#1a1d28; --muted:#5f6880; --accent:#6d4aff; --accent2:#0aa882;
    --warn:#b45309; --bad:#dc2626; --good:#16a34a;
    --shadow-sm:0 1px 6px rgba(0,0,0,.1);
    --shadow:0 6px 24px rgba(0,0,0,.15);
  }
  body.light .msg.assistant{background:#f0f4ff}
  body.light .toastui-editor-defaultUI{filter:invert(1) hue-rotate(180deg)}
  body.light .toastui-editor-defaultUI img{filter:invert(1) hue-rotate(180deg)}
  *{box-sizing:border-box}
  *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 34%,transparent) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 28%,transparent);
    border-radius:999px;border:3px solid transparent;background-clip:content-box}
  *:hover::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 46%,transparent);
    background-clip:content-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--font-ui);
       background:var(--bg);color:var(--ink);overflow:hidden;overflow:clip}
  /* Auth screen can scroll internally on very short viewports (body itself never scrolls) */
  #auth{overflow-y:auto}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
         color:var(--ink);border-radius:8px;padding:7px 12px;min-height:36px;
         transition:border-color .15s,box-shadow .15s,background .15s}
  button:hover{border-color:var(--accent);background:var(--panel)}
  button:focus-visible{outline:none;box-shadow:var(--glow)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;
    letter-spacing:.01em}
  button.primary:hover{background:color-mix(in srgb, var(--accent) 85%, white);border-color:var(--accent)}
  button.ghost{background:transparent}
  button.help-cta{background:color-mix(in srgb, var(--accent2) 18%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent2) 58%, var(--line));color:var(--ink);
    font-weight:700;box-shadow:0 0 0 1px color-mix(in srgb, var(--accent2) 18%, transparent)}
  button.help-cta:hover{background:color-mix(in srgb, var(--accent2) 26%, var(--panel));
    border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent2) 18%, transparent)}
  button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
  button.danger:hover{background:rgba(255,107,107,.08);border-color:var(--bad)}
  input,textarea,select{font:inherit;background:var(--panel);color:var(--ink);
         border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;
         transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(155,128,255,.15)}
  textarea{resize:vertical}
  a{color:var(--accent);text-decoration:none}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
  .pill.suggest{border-color:var(--warn);color:var(--warn)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}
  .hide{display:none!important}
  /* Shown only on phones (the mobile media query flips it on); the `.hide` class still wins
     (it's !important) so it can additionally be gated to specific views from JS. */
  .mobile-only{display:none}

  /* auth */
  #auth{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(155,128,255,.12) 0%, transparent 70%)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;
    box-shadow:var(--shadow-sm)}
  #auth .card{width:min(360px,calc(100vw - 32px));box-shadow:var(--shadow)}
  .brand{font-size:22px;font-weight:700;font-family:var(--font-ui);letter-spacing:-.02em}
  .brand .lock{color:var(--accent2)}
  .err{color:var(--bad);min-height:18px;font-size:13px}

  /* shell */
  #app{display:none;height:100vh;overflow:hidden;overflow:clip;grid-template-rows:auto 1fr;
       grid-template-columns:220px minmax(0,1fr);
       grid-template-areas:"top top" "side main"}
  #topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:10px 16px;
          border-bottom:1px solid var(--line);background:var(--panel);min-width:0;
          background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, var(--accent) 0%) 0%, var(--panel) 100%)}
  #topbar #modelTabs{display:none;min-width:0;overflow:hidden}
  #side{grid-area:side;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;
        overflow:hidden;transition:width .2s ease,padding .15s ease;display:flex;flex-direction:column}
  /* minimal authorship credit, pinned to the bottom of the side pane */
  .side-credit{margin-top:auto;padding:12px 8px 4px;font-family:var(--font-ui);font-size:11px;
        color:var(--muted);line-height:1.4}
  .side-credit a{color:var(--muted);text-decoration:none}
  .side-credit a:hover{color:var(--accent)}
  /* min-height/min-width:0 let the grid track govern size (no hardcoded topbar height,
     no flex/grid blowout from wide content → no surprise global scrollbars) */
  #main{grid-area:main;padding:18px 22px;overflow:auto;min-width:0;min-height:0;box-sizing:border-box}
  /* overflow:clip (with hidden fallback) — clips like hidden but is NOT a scroll container, so a
     focus/scrollIntoView inside the editor can't programmatically scroll these layout boxes and
     leave them stuck (the editor's own internal scroller absorbs it instead). */
  #main.detailmode{overflow:hidden;overflow:clip;display:flex;flex-direction:column;padding-bottom:0;min-height:0}
  .navbtn{display:block;width:100%;text-align:left;border:none;background:transparent;
          padding:10px 12px;border-radius:8px;color:var(--muted);margin-bottom:2px;
          font-size:13px;font-weight:600;letter-spacing:.01em;transition:color .15s,background .15s}
  .navbtn:hover{color:var(--ink);background:var(--panel2)}
  .navbtn.active{background:color-mix(in srgb, var(--accent) 12%, var(--panel2));
    color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 25%, transparent)}

  /* model switcher */
  .mtab{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel2)}
  .mtab.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mtab .gear{opacity:.6}
  #modelCfg{position:absolute;top:52px;right:16px;width:340px;max-width:calc(100vw - 32px);
            max-height:calc(100vh - 70px);overflow:auto;z-index:30}
  .model-card{cursor:default;transition:border-color .18s,box-shadow .18s}
  .model-card.active{border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset,0 4px 20px rgba(155,128,255,.15)}
  .model-card .model-title{display:flex;gap:8px;align-items:center;min-width:0}
  .model-card .model-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}

  /* grids */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s;
         box-shadow:var(--shadow-sm);min-width:0}
  .acard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
  /* min-width:0 down the chain (card → its flex .row → the h4) lets the nowrap title ellipsize
     instead of forcing the card — and the whole page — wider than the viewport. Without it, a
     `1fr` grid track resolves its `auto` minimum to the title's full min-content width. */
  .acard>.row{min-width:0}
  .acard h4{margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);
         color:var(--warn);flex-shrink:0;white-space:nowrap}

  /* bubble detail */
  #detail{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;flex:1;
          min-height:0;min-width:0}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;overflow:clip}
  .pane .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;
            align-items:center;flex-wrap:wrap;flex:0 0 auto;min-width:0;font-size:13px;font-weight:600}
  .pane .bd{padding:12px;overflow:auto;flex:1;min-height:0;min-width:0}
  #editor{width:100%;height:100%;min-height:340px;font-family:var(--font-mono);
          font-size:13px;border:none;background:transparent;resize:none}
  .preview{line-height:1.75;overflow-wrap:anywhere;word-break:break-word;
    font-family:var(--font-reading);font-size:16px}
  .preview h1{font-size:26px;font-family:var(--font-reading);font-weight:600;letter-spacing:-.01em}
  .preview h2{font-size:20px;border-bottom:1px solid var(--line);padding-bottom:4px;
    font-family:var(--font-reading);font-weight:600}
  .preview h3,.preview h4{font-family:var(--font-reading)}
  .preview p{margin:.6em 0}
  .preview code{background:var(--panel2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere;
    font-family:var(--font-mono);font-size:.85em}
  .preview pre{background:var(--panel2);padding:12px;border-radius:8px;overflow:auto;
    box-shadow:var(--shadow-sm)}
  .preview pre code{overflow-wrap:normal;word-break:normal;font-family:var(--font-mono);font-size:13px}
  .preview img{max-width:100%;height:auto;border-radius:8px;box-shadow:var(--shadow-sm)}
  /* tables + blockquotes — shared by the preview pane and chat messages */
  .preview table,.msg table{display:block;width:max-content;max-width:100%;overflow-x:auto;
        border-collapse:collapse;margin:8px 0;font-size:13px}
  .preview th,.preview td,.msg th,.msg td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .preview thead th,.msg thead th{background:var(--panel2)}
  .preview blockquote,.msg blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);
        color:var(--muted);background:var(--panel2);border-radius:0 6px 6px 0}
  .preview blockquote p,.msg blockquote p{margin:4px 0}
  /* Wide display-math scrolls inside its block instead of stretching the pane. */
  .katex-display{overflow-x:auto;overflow-y:hidden;max-width:100%}
  /* A numbered equation's \tag{} is KaTeX-positioned absolute at right:0, so a wide equation
     (common on mobile) runs straight under it. Take it out of absolute flow: the number then
     trails the centred body and can never overlap — a too-wide equation simply scrolls, number
     and all. (Centred-equation + flush-right-number can't both hold once the body fills the width.) */
  .katex-display>.katex>.katex-html>.tag{position:static;margin-left:1.2em}
  /* An equation's own number shares the accent + tabular figures with its cross-references,
     so a \tag and the \eqref pointing at it read as one typographic system. */
  .katex .tag,.katex-display .tag{color:var(--accent);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
  /* Cross-references: typeset inline links — tabular figures, a hairline underline that lifts
     into a soft pill on hover. They sit inside serif prose so they stay light, not chip-heavy. */
  .eq-ref,.thm-ref{font-family:var(--font-ui);font-weight:600;color:var(--accent);
    font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;white-space:nowrap;
    padding:0 .14em;border-radius:4px;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--accent) 40%,transparent);
    transition:background .14s ease,box-shadow .14s ease;cursor:default}
  .eq-ref:hover,.thm-ref:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);
    box-shadow:inset 0 -1px 0 transparent}
  /* Theorem / lemma / proof boxes: refined journal callouts, one jewel tone per class (--env). */
  .math-env{--env:var(--accent);position:relative;margin:1.6em 0;padding:.85em 1.15em .85em 1.4em;
    border-radius:4px 12px 12px 4px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--env) 9%,transparent),transparent 42%),var(--panel2);
    border:1px solid color-mix(in srgb,var(--env) 24%,var(--line));
    box-shadow:0 10px 30px -22px rgba(0,0,0,.8)}
  .math-env::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:4px 0 0 4px;
    background:linear-gradient(var(--env),color-mix(in srgb,var(--env) 35%,transparent))}
  .math-env-title{font-family:var(--font-ui);font-weight:700;font-size:.74em;letter-spacing:.14em;
    text-transform:uppercase;color:var(--env);margin-bottom:.45em;
    font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
  .math-env.definition,.math-env.proposition{--env:var(--accent2)}
  .math-env.remark{--env:var(--muted)}
  .math-env.proof{--env:color-mix(in srgb,var(--muted) 55%,var(--line))}
  .math-env.proof .math-env-title{letter-spacing:.12em;opacity:.85}
  .math-env .math-env-qed{text-align:right;margin-top:.5em;color:var(--env);opacity:.6;font-size:1.15em;line-height:1}

  /* chat */
  #chatlog{display:flex;flex-direction:column;gap:10px;min-width:0}
  .msg{padding:9px 11px;border-radius:10px;max-width:95%;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .msg pre{overflow:auto;max-width:100%}
  .msg img{max-width:100%;height:auto}
  .msg .katex-display{overflow-x:auto;overflow-y:hidden}
  .msg.user{align-self:flex-end;background:var(--panel2)}
  .msg.assistant{align-self:flex-start;background:#13202b;border:1px solid var(--line)}
  .synced{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--good);color:var(--good)}
  .synced.stale{border-color:var(--warn);color:var(--warn)}
  .synced.saving{border-color:var(--warn);color:var(--warn);opacity:.7}
  .synced.conflict{border-color:var(--bad);color:var(--bad);font-weight:600}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .small{font-size:12px;padding:5px 9px}
  .deepitem{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
  h2.section-title{margin:0 0 18px;font-family:var(--font-ui);font-weight:700;
    letter-spacing:-.02em;font-size:20px}
  .spacer{flex:1}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);
         border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:50}

  /* help modal tabs */
  .help-tab{padding:8px 14px;font-family:var(--font-ui);font-size:12px;font-weight:600;
    cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;
    margin-bottom:-1px;white-space:nowrap;transition:color .15s}
  .help-tab:hover{color:var(--ink)}
  .help-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  /* modal overlay (used by the help modal) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
           justify-content:center;z-index:60}
  .diffbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
           width:min(840px,93vw);max-height:85vh;display:flex;flex-direction:column}
  .diffbody{overflow:auto;padding:10px 12px;line-height:1.5}

  /* chat pane collapse */
  #detail.chat-collapsed{grid-template-columns:1fr}
  #detail.chat-collapsed>.pane:last-child{display:none!important}
  /* preview-pane toggle is handled via S.previewEl.classList.toggle("hide") */

  /* page tabs + editor host */
  .ptabs{display:flex;gap:10px;align-items:center;padding:8px 10px;
         border-bottom:1px solid var(--line);flex:0 0 auto;min-width:0}
  .ptab-scroll{display:flex;gap:4px;align-items:center;min-width:0;flex:1 1 auto;
         overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
  .ptab-scroll::-webkit-scrollbar{height:8px}
  .ptab-scroll::-webkit-scrollbar-thumb{border-width:2px}
  .ptab-scroll>*{flex:0 0 auto}
  .ptab-controls{display:flex;gap:8px;align-items:center;flex:0 0 auto;white-space:nowrap}
  .ptab{padding:4px 10px;border-radius:7px 7px 0 0;border:1px solid var(--line);
        background:var(--panel2);cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center;
        max-width:280px}
  .ptab>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ptab.active{border-color:var(--accent);color:var(--ink);background:var(--bg)}
  .ptab .x{opacity:.5;font-size:11px}
  .ptab .x:hover{opacity:1;color:var(--bad)}
  .ptab-edit{font-size:13px;padding:2px 6px;width:130px;border-radius:5px}
  #editorHost{flex:1;min-height:0;min-width:0;display:flex;overflow:hidden;overflow:clip}
  #editorWrap{flex:1;min-height:0;min-width:0;overflow:hidden;overflow:clip}
  #editorWrap .toastui-editor-defaultUI{height:100%}
  #previewWrap{flex:1;overflow:auto;padding:12px 16px;min-width:0;min-height:0;line-height:1.6}
  /* The editor pane has three view modes, chosen from the toolbar dropdown:
     view  = rendered page only (default reading view),
     edit  = Markdown editor only,
     split = editor + live preview side-by-side (the classic layout). */
  #editorHost.mode-view #editorWrap{display:none}
  #editorHost.mode-edit #previewWrap{display:none}
  #editorHost.mode-split #previewWrap{border-left:1px solid var(--line)}
  /* Hide Toast UI's built-in preview controls — we use our own custom renderer */
  .toastui-editor-mode-switch{display:none!important}
  .toastui-editor-tabs{display:none!important}
  .wikilink{color:var(--accent2);border-bottom:1px dashed var(--accent2);cursor:pointer}
  .todoref{color:var(--accent);font-weight:500;cursor:pointer;text-decoration:none;
    background:rgba(124,156,255,.12);padding:0 4px;border-radius:4px}
  .scopebar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
  .scopebar select{width:auto;max-width:230px}
  .sessionbar{display:flex;gap:6px;align-items:center;padding:5px 10px;
              border-bottom:1px solid var(--line);flex:0 0 auto}
  .sessionbar select{flex:1;font-size:12px}
  /* deep-read pill selector */
  .drwrap{padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .drpills{display:flex;flex-wrap:wrap;gap:5px;min-height:0}
  .drpill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);
           border:1px solid var(--accent2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--accent2)}
  .drpill .x{opacity:.6;cursor:pointer} .drpill .x:hover{opacity:1;color:var(--bad)}
  .drrow{display:flex;gap:6px;align-items:center}
  .drrow select{flex:1;font-size:12px}
  /* sessions management panel */
  .sessions-panel{border-bottom:1px solid var(--line);flex:0 0 auto;max-height:180px;overflow-y:auto}
  .session-row{display:flex;align-items:center;gap:6px;padding:5px 10px;border-top:1px solid var(--line);font-size:12px}
  .session-row:first-child{border-top:none}
  .session-row .session-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  /* "Papers in this bubble": papers render as wrapped, pressable pills (same look as the
     chat's deep-read pills) — each links to the PDF; a remove ✕ only appears in edit mode. */
  .bubble-pdf-list{display:flex;flex-wrap:wrap;gap:5px}
  .paperchip{display:inline-flex;align-items:center;gap:5px;max-width:220px;
             background:var(--panel2);border:1px solid var(--accent2);border-radius:999px;
             padding:2px 9px;font-size:12px;color:var(--accent2);text-decoration:none}
  .paperchip:hover{border-color:var(--accent);color:var(--accent)}
  .paperchip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .paperchip .x{opacity:.6;cursor:pointer;flex:0 0 auto}
  .paperchip .x:hover{opacity:1;color:var(--bad)}
  /* In the editor's inline strip, show ~2 rows of pills then scroll
     (the mobile Papers sheet reuses the same list but isn't capped — it has room). */
  .bubble-papers-inline .bubble-pdf-list{max-height:60px;overflow:auto}
  .mobile-bubble-actions,.mobile-sheet{display:none}

  /* ── Mobile ── */
  @media (max-width:700px){
    /* On phones the whole page scrolls naturally instead of a locked app shell.
       overflow-x:clip is a safety net: it kills any horizontal page scroll (which would
       otherwise let a too-wide child shift content left and clip the left edge) without
       turning the body into a vertical scroll container the way overflow-x:hidden would. */
    html,body{height:auto;overflow-y:visible;overflow-x:clip}
    body.mobile-sheet-open{overflow:hidden}
    #app{height:auto;min-height:var(--vvh);overflow:visible;grid-template-columns:0 minmax(0,1fr)!important}
    /* keep the topbar pinned while the page scrolls */
    #topbar{position:sticky;top:0;z-index:25;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;gap:6px}
    /* The brand is the one flexible item: it truncates first so the controls on the right
       (account / help / theme / log out) always stay visible and never wrap. */
    #topbar .brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #topbar button{flex-shrink:0;white-space:nowrap;min-height:40px;padding:6px 10px}
    /* always collapse sidebar — hamburger still toggles it as a narrow overlay */
    #side{width:0!important;min-width:0!important;padding:0!important;border-right:none!important;
          position:fixed;top:calc(49px + env(safe-area-inset-top));bottom:0;left:0;z-index:20;
          box-shadow:4px 0 24px rgba(0,0,0,.5)}
    #app.side-open #side{width:240px!important;padding:14px 12px!important;border-right:1px solid var(--line)!important}
    #app.side-open #side .navbtn{min-height:44px;display:flex;align-items:center}
    #app.side-open::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;
      backdrop-filter:blur(2px)}
    /* main scrolls with the page */
    #main{height:auto;overflow:visible;padding:14px 12px}
    #main.detailmode{height:auto;overflow:visible;min-height:0;padding:12px 10px 84px}
    #detail{display:block;min-height:0}
    .pane{height:auto;min-height:0}
    #detail>.editor-pane{height:calc(var(--vvh) - 154px - env(safe-area-inset-top));min-height:min(380px, calc(var(--vvh) - 154px))}
    #detail>.chat-pane,.bubble-papers-inline,.desktop-only-tool{display:none!important}
    .mobile-only{display:inline-flex;align-items:center}
    /* Mobile respects the chosen view mode (the Split/Edit/Read selector is visible here now).
       Panes stack vertically; the .mode-view/.mode-edit rules above hide whichever pane isn't
       wanted, and split shows both — editor above preview. */
    #editorHost{flex-direction:column}
    .mobile-bubble-actions{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);
      display:flex;justify-content:space-between;gap:12px;z-index:45;pointer-events:none}
    .mobile-bubble-actions button{pointer-events:auto;border-radius:999px;padding:12px 18px;
      min-height:48px;font-size:13px;font-weight:600;
      box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
    .mobile-sheet{display:block;position:fixed;inset:0;z-index:70;pointer-events:none}
    .mobile-sheet.open{pointer-events:auto}
    .mobile-sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.52);opacity:0;
      transition:opacity .2s ease;backdrop-filter:blur(2px)}
    .mobile-sheet.open .mobile-sheet-backdrop{opacity:1}
    .mobile-sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(var(--vvh) - 12px);
      background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
      display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
      padding-bottom:env(safe-area-inset-bottom)}
    .mobile-sheet-panel::before{content:'';display:block;width:36px;height:4px;border-radius:2px;
      background:var(--line);margin:10px auto 0;flex-shrink:0}
    .mobile-sheet.open .mobile-sheet-panel{transform:translateY(0)}
    .mobile-sheet-hd{padding:12px 14px 10px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:8px;font-weight:600}
    .mobile-sheet-body{overflow:auto;min-height:0;display:flex;flex-direction:column}
    .mobile-sheet-body>.pane{height:calc(var(--vvh) - 90px);min-height:0;border:none;border-radius:0;background:transparent}
    .mobile-sheet-body>.bd{padding:12px;overflow:auto}
    .mobile-sheet-body .chat-pane{display:flex!important}
    .mobile-sheet-body .chat-titlebar{display:none!important}
    .mobile-sheet-body .chat-pane:not(.chat-controls-open) .sessionbar,
    .mobile-sheet-body .chat-pane:not(.chat-controls-open) .sessions-panel,
    .mobile-sheet-body .chat-pane:not(.chat-controls-open) .drwrap{display:none!important}
    #modelCfg{position:fixed;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;
      width:auto;max-width:none;max-height:calc(var(--vvh) - 82px);border-radius:14px}
    /* single-column cards. minmax(0,1fr) (not 1fr) forces the track minimum to 0 so a card's
       nowrap title can't blow the column — and the page — wider than the viewport. */
    .grid{grid-template-columns:minmax(0,1fr)}
    .brand{font-size:18px;letter-spacing:-.02em}
    /* Larger touch targets in the bubble toolbar on mobile */
    .ptab{min-height:38px;display:flex;align-items:center}
    /* Settings cards full-width */
    .card{border-radius:10px}
  }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth">
  <div class="card col">
    <div class="brand">🔒 <span class="lock">locked</span>in</div>
    <div class="muted">The ultimate research assistant for grad students.</div>
    <input id="au_user" placeholder="username" autocomplete="username">
    <input id="au_pass" type="password" placeholder="password" autocomplete="current-password">
    <div class="row">
      <button class="primary" id="au_login">Log in</button>
      <button id="au_signup">Sign up</button>
    </div>
    <div class="err" id="au_err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div id="topbar">
    <button class="ghost small" id="sideToggle" title="Toggle sidebar" style="font-size:16px;padding:5px 10px">☰</button>
    <div class="brand">🔒 <span class="lock">locked</span>in</div>
    <div class="row" id="modelTabs"></div>
    <div class="spacer"></div>
    <button class="ghost small help-cta" id="helpBtn" title="Help and user guide">Help</button>
    <button class="ghost small" id="themeToggle" title="Toggle light/dark mode">☀️</button>
    <!-- mobile-only: opens the read-only preview of the current bubble page; hidden off a bubble -->
    <button class="ghost small mobile-only hide" id="previewArrow" title="Open the read-only preview of this page">↗</button>
  </div>

  <div id="side">
    <button class="navbtn active" data-view="assets">📚 Assets</button>
    <button class="navbtn" data-view="bubbles">🫧 Bubbles</button>
    <button class="navbtn" data-view="attention">🔔 Attention <span id="attnCount" class="muted"></span></button>
    <button class="navbtn" data-view="todos">✅ TODOs</button>
    <button class="navbtn" data-view="news" id="newsNav" style="display:none">📰 News <span id="newsCount" class="muted"></span></button>
    <button class="navbtn" data-view="settings">⚙️ Settings</button>
    <div class="side-credit">Made with 💜 + 🤖 by <a href="https://github.com/HamidrezaKmK" target="_blank" rel="noopener">HamidrezaKmK</a></div>
  </div>

  <div id="main"></div>
</div>

<div id="modelCfg" class="card col hide"></div>
<div id="helpModal" class="overlay hide">
  <div class="diffbox col" style="width:min(900px,97vw);max-height:92vh;padding:0;gap:0;overflow:hidden">
    <div class="hd" style="padding:10px 16px;flex-shrink:0;display:flex;align-items:center;gap:8px"><b>User Guide</b><span class="spacer"></span>
      <button class="ghost small" id="helpClose">✕</button></div>
    <div id="helpTabs" style="display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 12px"></div>
    <div class="diffbody preview" id="helpBody" style="font-family:inherit;font-size:14px;padding:20px 24px;overflow-y:auto;flex:1;min-height:0"></div>
  </div>
</div>
<div id="toast" class="toast hide"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const el = (t,a={},...kids)=>{const e=document.createElement(t);
    for(const k in a){ if(k==="class")e.className=a[k]; else if(k==="html")e.innerHTML=a[k];
      else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]); else e.setAttribute(k,a[k]); }
    for(const c of kids){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(c)); }
    return e;};
  const toast = (m)=>{const t=$("#toast"); t.textContent=m; t.classList.remove("hide");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add("hide"),2600);};
  function updateViewportVars(){
    const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
    document.documentElement.style.setProperty("--vvh", Math.max(320,Math.round(h))+"px");
  }
  updateViewportVars();
  window.addEventListener("resize",updateViewportVars,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener("resize",updateViewportVars,{passive:true});

  // ---------- sidebar toggle ----------
  function applySideCollapsed(collapsed){
    const side=document.getElementById("side"), app=document.getElementById("app");
    if(!side||!app)return;
    if(collapsed){
      side.style.width="0"; side.style.padding="0"; side.style.borderRight="none";
      app.style.gridTemplateColumns="0 1fr";
    } else {
      side.style.width=""; side.style.padding=""; side.style.borderRight="";
      app.style.gridTemplateColumns="220px 1fr";
    }
  }
  document.getElementById("sideToggle").onclick=()=>{
    if(window.innerWidth<=700){
      // Mobile: toggle overlay class; tap backdrop to close
      document.getElementById("app").classList.toggle("side-open");
    } else {
      const next=localStorage.getItem("li_side")!=="1";
      localStorage.setItem("li_side",next?"1":"0");
      applySideCollapsed(next);
    }
  };
  // Close mobile sidebar when tapping the backdrop
  document.getElementById("app").addEventListener("click",e=>{
    if(e.target===e.currentTarget&&window.innerWidth<=700)
      e.currentTarget.classList.remove("side-open");
  });
  // Close mobile sidebar when a nav item is tapped
  document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{
    if(window.innerWidth<=700) document.getElementById("app").classList.remove("side-open");
  }));

  // ---------- hash routing ----------
  function pushRoute(hash){history.pushState(null,"",hash?"#"+hash:"#");}
  function applyHash(){
    const h=location.hash.replace(/^#/,"");
    if(!h||h==="assets"){switchView("assets",{noRoute:true});return;}
    if(h==="bubbles"){switchView("bubbles",{noRoute:true});return;}
    if(h==="attention"){switchView("attention",{noRoute:true});return;}
    if(h==="news"){switchView("news",{noRoute:true});return;}
    if(h==="settings"){switchView("settings",{noRoute:true});return;}
    if(h==="todos"){switchView("todos",{noRoute:true});return;}
    const tm=h.match(/^todos\/(\d+)$/);
    if(tm){viewTodo(+tm[1]);return;}
    const m=h.match(/^bubble\/([^/]+)(?:\/([^/]+))?$/);
    if(m){openBubble(m[1],{noRoute:true,page:m[2]||null});return;}
    switchView("assets",{noRoute:true});
  }
  window.onpopstate=()=>applyHash();

  // The SPA is a fixed 100vh layout — every view scrolls inside its own container, so the
  // *document* itself should never scroll. A focused editor on a long page can nonetheless
  // scroll the viewport (which pushes the whole fixed-height app off-screen, leaving a blank
  // void). Snap the document back to the top whenever that happens. Guarded against the
  // scrollTo→scroll feedback loop.
  let _snapping=false;
  window.addEventListener("scroll",()=>{
    if(_snapping)return;
    const main=document.getElementById("main");
    if(window.innerWidth<=700 || !main || !main.classList.contains("detailmode")) return;
    if(window.scrollX||window.scrollY){ _snapping=true; window.scrollTo(0,0); _snapping=false; }
  },{passive:true});

  // ---------- api ----------
  async function api(path, opts={}){
    const r = await fetch(path, {credentials:"include", headers:{"Content-Type":"application/json"}, ...opts});
    if(!r.ok){ let d; try{d=(await r.json()).detail;}catch(e){d=r.statusText;} const err=new Error(d||"Error"); err.status=r.status; throw err; }
    const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
  }
  // SSE over POST; returns AbortController. onEvent({type,...}).
  function streamPost(path, body, onEvent){
    const ac = new AbortController();
    (async()=>{
      const r = await fetch(path,{method:"POST",credentials:"include",signal:ac.signal,
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
      while(true){
        const {value,done}=await reader.read(); if(done)break;
        buf+=dec.decode(value,{stream:true});
        let i; while((i=buf.indexOf("\n\n"))>=0){
          const line=buf.slice(0,i).trim(); buf=buf.slice(i+2);
          if(line.startsWith("data:")){ try{ onEvent(JSON.parse(line.slice(5).trim())); }catch(e){} }
        }
      }
    })().catch(e=>{ if(e.name!=="AbortError") onEvent({type:"error",detail:e.message}); });
    return ac;
  }

  // ---------- markdown + math ----------
  // opts.refs (bubble-wide reference registry from /api/bubbles/<slug>/refs) + opts.pageSlug make
  // equation/theorem numbers and \eqref/\thmref resolve ACROSS pages; without them numbering is
  // self-contained to this content (chat, TODO notes, summaries, the help guide). Mirrors the
  // server's _build_refs/_preprocess_* so the live editor preview matches the standalone pages.
  function renderMarkdown(md,opts){
    opts=opts||{}; const refs=opts.refs;
    const store=[]; let s=md||"";
    // Pre-stash fenced code blocks so Pass 0 and math stashing never touch their content.
    const cbStore=[];
    s=s.replace(/^(`{3,})[^\n]*\n[\s\S]*?\n\1/gm,m=>{ cbStore.push(m); return '\n\n@@CB'+(cbStore.length-1)+'@@\n\n'; });
    // Pre-stash INLINE code spans too — so `$x$`, `[[link]]`, `@5`, `\begin{theorem}` written
    // inside backticks render as literal source (the syntax columns in the user guide rely on
    // this) instead of being picked up by the math/theorem/eqref passes below. Restored last.
    const icStore=[];
    s=s.replace(/`([^`\n]+)`/g,(m,p1)=>{ icStore.push(p1); return '@@IC'+(icStore.length-1)+'@@'; });
    // Pass 1 — determine equation numbers. With a bubble-wide registry (refs) the label→number
    // map is global, so \eqref resolves across pages; otherwise collect \label{} from THIS
    // content's display math in document order ($$...$$ and environments). Runs BEFORE theorem
    // stashing (Pass 0) so equations inside theorem/proof blocks join the numbering.
    let eqN, eqI=0;
    if(refs){ eqN=refs.eq||{}; }
    else {
      eqN={};
      const _ENVPAT=/\\begin\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}([\s\S]*?)\\end\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}/g;
      const _allBlocks=[]; let _dm;
      const _dr=/\$\$([\s\S]+?)\$\$/g;
      _dr.lastIndex=0; while((_dm=_dr.exec(s))!==null) _allBlocks.push({pos:_dm.index,inner:_dm[1]});
      _ENVPAT.lastIndex=0; while((_dm=_ENVPAT.exec(s))!==null) _allBlocks.push({pos:_dm.index,inner:_dm[1]});
      _allBlocks.sort((a,b)=>a.pos-b.pos);
      for(const {inner} of _allBlocks){
        const _lr=/\\label\{([^}]+)\}/g; let _lm;
        while((_lm=_lr.exec(inner))!==null){ const lb=_lm[1]; if(!(lb in eqN)) eqN[lb]=++eqI; }
      }
    }
    const hasEq=Object.keys(eqN).length>0;
    // Pass 2 — replace \label{name} with \tag{n} in $$...$$ blocks and environments;
    // always star non-starred environments to suppress KaTeX's built-in auto-counter. An unknown
    // label (e.g. just typed, not yet in the saved registry) is dropped so KaTeX doesn't choke.
    const _retag=inner=>inner.replace(/\\label\{([^}]+)\}/g,(f,lb)=>eqN[lb]?'\\tag{'+eqN[lb]+'}':'');
    const _star=env=>env.endsWith('*')?env:env+'*';
    if(hasEq) s=s.replace(/\$\$([\s\S]+?)\$\$/g,(f,inner)=>'$$'+_retag(inner)+'$$');
    s=s.replace(/\\begin\{(align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}([\s\S]*?)\\end\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}/g,
      (f,env,inner)=>{ const se=_star(env); return '\\begin{'+se+'}'+_retag(inner)+'\\end{'+se+'}'; });
    // Pass 0 — NOW stash \begin{theorem|lemma|...} environments. Their inner math already carries
    // \tag{n} from Pass 2, so equation numbers render correctly inside the box. Inner content is
    // stored raw; \label{} left inside (theorem labels) are recorded for \thmref references.
    // theoCounts seeds from the per-page offset (count of each env on earlier pages) so theorem
    // numbering is bubble-wide; theoLabels collects this page's labels, then merges the global
    // map (refs.thm) so \thmref resolves to theorems on other pages too.
    const theoStore=[];
    const theoCounts=(refs&&refs.thmStart&&opts.pageSlug&&refs.thmStart[opts.pageSlug])
      ? Object.assign({},refs.thmStart[opts.pageSlug]) : {};
    let theoLabels={};
    const _THEO_ENVS='theorem|lemma|corollary|definition|proposition|remark|proof';
    const _THEO_RE=new RegExp('\\\\begin\\{('+_THEO_ENVS+')\\}(?:\\[([^\\]]*)\\])?([\\s\\S]*?)\\\\end\\{(?:'+_THEO_ENVS+')\\}','gi');
    s=s.replace(_THEO_RE,(m,env,optTitle,inner)=>{
      const e=env.toLowerCase(), numbered=(e!=='proof');
      if(numbered) theoCounts[e]=(theoCounts[e]||0)+1;
      const n=numbered?theoCounts[e]:0;
      const cap=e.charAt(0).toUpperCase()+e.slice(1);
      const title=numbered?(optTitle?`${cap} ${n} (${optTitle.trim()})`:cap+' '+n)
                          :(optTitle?`${cap} (${optTitle.trim()})`:cap);
      // Extract \label{} from inner content and record for \thmref
      let cleanInner=inner.replace(/\\label\{([^}]+)\}/g,(_,lb)=>{ theoLabels[lb]={env:e,number:n}; return ''; });
      theoStore.push({env:e,title,inner:cleanInner.trim(),proof:!numbered});
      return '\n\n@@TH'+(theoStore.length-1)+'@@\n\n';
    });
    // Merge the global theorem labels (other pages) under this page's local ones (which win).
    if(refs&&refs.thm) theoLabels=Object.assign({},refs.thm,theoLabels);
    // Stash all math tokens so marked.js can't mangle them. This MUST come before the
    // \thmref/\eqref span substitutions below, so an in-math reference stays raw inside the
    // stashed source (renderMath resolves it for KaTeX) instead of being turned into an HTML span.
    const stash=(re,display)=>{ s=s.replace(re,(m,p1)=>{ store.push({src:p1,display}); return `@@M${store.length-1}@@`; }); };
    s=s.replace(/(\\begin\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}[\s\S]*?\\end\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\})/g,(m,p1)=>{ store.push({src:p1,display:true}); return `@@M${store.length-1}@@`; });
    stash(/\$\$([\s\S]+?)\$\$/g,true);
    stash(/\\\[([\s\S]+?)\\\]/g,true);
    stash(/\\\(([\s\S]+?)\\\)/g,false);
    stash(/\$([^\$\n]+?)\$/g,false);
    // Replace \thmref{name} in the remaining (non-math) text with styled inline references.
    s=s.replace(/\\thmref\{([^}]+)\}/g,(_,lb)=>{
      const t=theoLabels[lb]; if(!t) return `\\thmref{${lb}}`;
      const cap=t.env.charAt(0).toUpperCase()+t.env.slice(1);
      return `<span class="thm-ref">${cap} ${t.number}</span>`;
    });
    // Pass 3 — replace \eqref{}/\ref{} in remaining (non-math) text
    if(hasEq){
      s=s.replace(/\\eqref\{([^}]+)\}/g,(_,lb)=>`<span class="eq-ref">(${eqN[lb]||"?"})</span>`);
      s=s.replace(/\\ref\{([^}]+)\}/g,(_,lb)=>`<span class="eq-ref">${eqN[lb]||"?"}</span>`);
    }
    // Resolve \eqref/\ref/\thmref that appear INSIDE math to KaTeX-renderable plain math (KaTeX
    // doesn't know these commands — a raw one breaks the whole equation). Mirrors the server's
    // _resolve_refs_in_math. Runs at render time, when eqN + theoLabels are fully populated.
    const resolveRefsInMath=src=>{
      let r=src.replace(/\\eqref\{([^}]+)\}/g,(_,lb)=>`(${eqN[lb]||"?"})`)
              .replace(/\\ref\{([^}]+)\}/g,(_,lb)=>`${eqN[lb]||"?"}`);
      return r.replace(/\\thmref\{([^}]+)\}/g,(_,lb)=>{
        const t=theoLabels[lb]; if(!t) return `\\thmref{${lb}}`;
        return `\\text{${t.env.charAt(0).toUpperCase()+t.env.slice(1)} ${t.number}}`;
      });
    };
    const renderMath=src=>{ try{ return katex.renderToString(resolveRefsInMath(src.src),{displayMode:src.display,macros:S.mathMacros,throwOnError:false}); }
      catch(e){ return `<span style="color:#ff7a7a">${src.src}</span>`; } };
    let html=marked.parse(s,{breaks:true});
    html=html.replace(/@@M(\d+)@@/g,(m,i)=>renderMath(store[+i]));
    // Restore theorem/lemma/proof blocks: render inner content (math + markdown)
    html=html.replace(/<p>@@TH(\d+)@@<\/p>/g,(m,i)=>{
      const t=theoStore[+i];
      const istore=[]; let is=t.inner;
      const istash=(re,disp)=>{ is=is.replace(re,(_,p1)=>{ istore.push({src:p1,display:disp}); return `@@IM${istore.length-1}@@`; }); };
      is=is.replace(/(\\begin\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\}[\s\S]*?\\end\{(?:align\*?|alignat\*?|gather\*?|multline\*?|equation\*?)\})/g,(_,p1)=>{ istore.push({src:p1,display:true}); return `@@IM${istore.length-1}@@`; });
      istash(/\$\$([\s\S]+?)\$\$/g,true);
      istash(/\\\[([\s\S]+?)\\\]/g,true);
      istash(/\\\(([\s\S]+?)\\\)/g,false);
      istash(/\$([^\$\n]+?)\$/g,false);
      // Resolve \eqref/\ref/\thmref in theorem prose now that inner math is stashed — the body
      // Pass 3 couldn't reach these (they were hidden inside the @@TH placeholder).
      if(hasEq){
        is=is.replace(/\\eqref\{([^}]+)\}/g,(_,lb)=>`<span class="eq-ref">(${eqN[lb]||"?"})</span>`);
        is=is.replace(/\\ref\{([^}]+)\}/g,(_,lb)=>`<span class="eq-ref">${eqN[lb]||"?"}</span>`);
      }
      is=is.replace(/\\thmref\{([^}]+)\}/g,(_,lb)=>{
        const tr=theoLabels[lb]; if(!tr) return `\\thmref{${lb}}`;
        const c2=tr.env.charAt(0).toUpperCase()+tr.env.slice(1);
        return `<span class="thm-ref">${c2} ${tr.number}</span>`;
      });
      let ih=marked.parse(is,{breaks:true});
      ih=ih.replace(/@@IM(\d+)@@/g,(_,j)=>renderMath(istore[+j]));
      const qed=t.proof?'<div class="math-env-qed">∎</div>':'';
      return `<div class="math-env ${t.env}"><div class="math-env-title">${t.title}</div>${ih}${qed}</div>`;
    });
    // Restore fenced code blocks (rendered through marked so they get proper <pre><code> wrapping)
    html=html.replace(/<p>@@CB(\d+)@@<\/p>/g,(_,i)=>marked.parse(cbStore[+i],{breaks:true}));
    // Restore inline code LAST and globally (placeholders can land inside theorem HTML too).
    // Escape HTML so the literal source shows verbatim; unescape \| like marked does in tables.
    const _esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    html=html.replace(/@@IC(\d+)@@/g,(_,i)=>'<code>'+_esc(icStore[+i].replace(/\\\|/g,"|"))+'</code>');
    return html;
  }

  async function refreshHealth({live=false,seq=null,expect=null}={}){
    const active=S.model&&S.model.active;
    markProviderHealth(active,"bad");
    let note=$("#settingsHealth");
    if(note)note.textContent=live?"Sending a test message to "+active+"…":"Checking active model…";
    const details=$("#settingsHealthDetails");
    if(details)details.classList.add("hide");
    try{ const h=await api("/api/health"+(live?"?live=1":""));
      if(seq!==null && seq!==S.healthSeq)return;
      if(expect && h.active!==expect)return;
      if(live)S.verifiedActive=h.ok?h.active:null;
      if(live && S.view==="settings")viewSettings({checkHealth:false});
      markProviderHealth(h.active,h.ok?"ok":"bad");
      renderHealthStatus(h.ok,h.message||h.active);
    }catch(e){
      S.verifiedActive=null;
      markProviderHealth(active,"bad");
      renderHealthStatus(false,e.message||String(e));
    }

      const cur=tags.value.split(",").map(s=>s.trim()).filter(Boolean);
      if(!cur.some(t=>t.toLowerCase()===name.toLowerCase())){ cur.push(name); tags.value=cur.join(", "); } };
    const url=el("input",{placeholder:"…or paste a PDF link to fetch it automatically (no file needed)"});
    const btn=el("button",{class:"primary"},"Add paper");
    btn.onclick=async()=>{
      const hasFile=!!file.files[0], link=url.value.trim();
      if(!hasFile && !link){toast("Choose a PDF or paste a PDF link.");return;}
      btn.disabled=true; btn.textContent=hasFile?"Uploading…":"Fetching…";
      try{
        let d;
        if(hasFile){
          const fd=new FormData(); fd.append("file",file.files[0]);
          fd.append("title",title.value); fd.append("tags",tags.value); fd.append("url_source",link);
          const r=await fetch("/api/assets/upload",{method:"POST",credentials:"include",body:fd});
          if(!r.ok)throw new Error((await r.json()).detail);
          d=await r.json();
        }else{
          d=await api("/api/assets/upload-url",{method:"POST",body:JSON.stringify({url:link,title:title.value,tags:tags.value})});
        }
        toast(d.attention_flag?"Added — auto-tagging in background…":"Added — summarizing in background…");
        file.value="";title.value="";tags.value="";url.value="";
        viewAssets();
      }catch(e){toast(e.message);} finally{btn.disabled=false;btn.textContent="Add paper";}
    };
    f.append(el("b",{},"Add a paper / blogpost"),file,title,tags,bubbleSel,url,btn);
    m.append(f, el("div",{style:"height:16px"}));

    const r=await api("/api/assets");
    if(!r.assets.length){ m.append(el("div",{class:"muted"},"No assets yet. Upload your first PDF above.")); return; }
    const grid=el("div",{class:"grid"});
    r.assets.forEach(a=>grid.append(assetCard(a)));
    m.append(grid);
  }
  function assetCard(a){
    const c=el("div",{class:"acard"});
    const head=el("div",{class:"row"}, el("h4",{},a.title||a.filename||a.pdf_id));
    if(a.attention_flag)head.append(el("span",{class:"badge"},"needs review"));
    c.append(head);
    const tagWrap=el("div",{});
    (a.tags||[]).forEach(t=>tagWrap.append(el("span",{class:"pill"},t)));
    // suggestions are only a hint for un-tagged papers — once bubbles are picked, drop them
    if(!(a.tags||[]).length)
      (a.suggested_tags||[]).forEach(t=>tagWrap.append(el("span",{class:"pill suggest"},"? "+t)));
    c.append(tagWrap);
    c.append(el("div",{class:"muted",style:"font-size:12px;margin-top:6px"},
      (a.summarized?"summarized • ":"") + (a.date_added||"").slice(0,10)));
    c.append(el("div",{class:"row",style:"margin-top:10px"},
      el("button",{class:"ghost small",onclick:async(e)=>{
        e.stopPropagation();
        const next=!a.attention_flag;
        await api("/api/assets/"+a.pdf_id,{method:"PATCH",body:JSON.stringify({attention_flag:next})});
        toast(next?"Added to attention queue":"Removed from attention queue");
        viewAssets(); refreshAttnCount();
      }},a.attention_flag?"Remove from attention queue":"Add to attention queue")));
    c.onclick=()=>openAssetEditor(a);
    return c;
  }
  async function openAssetEditor(a, opts={}){
    const returnTo=opts.returnTo||"assets";
    const goBack=()=>returnTo==="attention"?viewAttention():viewAssets();
    const m=$("#main"); m.innerHTML="";
    m.append(el("button",{class:"ghost small",onclick:goBack},returnTo==="attention"?"← Attention":"← Assets"));
    const box=el("div",{class:"card col",style:"margin-top:12px;max-width:720px"});
    const title=el("input",{value:a.title||""});
    const tags=el("input",{value:(a.tags||[]).join(", ")});
    const notes=el("textarea",{rows:"4"}); notes.value=a.notes||"";
    const url=el("input",{value:a.url_source||""});
    // dropdown of existing bubbles — pick one instead of retyping its name every time
    const bubbleSel=el("select");
    bubbleSel.append(el("option",{value:""},"➕ Pick an existing bubble…"));
    // option label = display name; value = the bubble's stable membership tag (slugifies to its
    // slug) so picking a *renamed* bubble still tags the paper into that same bubble, not a phantom.
    try{ (await api("/api/bubbles")).bubbles.forEach(b=>bubbleSel.append(el("option",{value:b.tag||b.name},b.name))); }catch(e){}
    bubbleSel.onchange=()=>{ const name=bubbleSel.value; bubbleSel.value=""; if(!name)return;
      const cur=tags.value.split(",").map(s=>s.trim()).filter(Boolean);
      if(!cur.some(t=>t.toLowerCase()===name.toLowerCase())){ cur.push(name); tags.value=cur.join(", "); } };
    box.append(el("b",{},"Edit asset"),
      el("label",{class:"muted"},"Title"),title,
      el("label",{class:"muted"},"Tags (comma-separated)"),tags,bubbleSel,
      el("label",{class:"muted"},"Notes"),notes,
      el("label",{class:"muted"},"Source URL"),url);
    // suggestions are only a hint while a paper is still un-tagged
    if(!(a.tags||[]).length && (a.suggested_tags||[]).length){
      const sg=el("div",{class:"row"},el("span",{class:"muted"},"Suggested:"));
      a.suggested_tags.forEach(t=>{ const p=el("span",{class:"pill suggest",style:"cursor:pointer"},"+ "+t);
        p.onclick=()=>{ tags.value=(tags.value?tags.value+", ":"")+t; }; sg.append(p); });
      box.append(sg);
    }
    const saveAsset=async(attentionFlag)=>{
      const tagList=tags.value.split(",").map(s=>s.trim()).filter(Boolean);
      const payload={title:title.value,tags:tagList,notes:notes.value,url_source:url.value,suggested_tags:[]};
      if(attentionFlag!==undefined)payload.attention_flag=attentionFlag;
      await api("/api/assets/"+a.pdf_id,{method:"PATCH",body:JSON.stringify(payload)});
      for(const t of tagList){ await api("/api/bubbles",{method:"POST",body:JSON.stringify({name:t})}); }
      toast(attentionFlag===false?"Saved and cleared from attention queue":attentionFlag===true?"Saved and moved to attention queue":"Saved");
      goBack(); refreshAttnCount();
    };
    const actionRow=el("div",{class:"row"},
      el("button",{class:"primary",onclick:async()=>saveAsset(undefined)},"Save"));
    if(a.attention_flag){
      actionRow.append(el("button",{class:"ghost",onclick:async()=>saveAsset(false)},"Remove from attention queue"));
    }else{
      actionRow.append(el("button",{class:"ghost",onclick:async()=>saveAsset(true)},"Move to attention queue"));
    }
    actionRow.append(
      el("a",{href:"/api/assets/"+a.pdf_id+"/pdf",target:"_blank"},
        el("button",{class:"ghost"},"Open PDF")),
      el("span",{class:"spacer"}),
      el("button",{class:"ghost",onclick:async()=>{ if(confirm("Delete this asset?")){
        await api("/api/assets/"+a.pdf_id,{method:"DELETE"}); toast("Deleted"); goBack(); refreshAttnCount(); }}},"Delete"));
    box.append(actionRow);
    m.append(box);
    // show cached summary
    const sumWrap=el("div",{class:"card",style:"margin-top:12px;max-width:720px"});
    sumWrap.append(el("b",{},"AI summary"));
    const body=el("div",{class:"preview",style:"margin-top:8px"});
    let sum=""; try{ sum=(await api("/api/assets/"+a.pdf_id+"/summary")).summary; }catch(e){}
    body.innerHTML=renderMarkdown(sum||"_Not summarized yet._");
    sumWrap.append(body); m.append(sumWrap);
  }

  // ================= IDEA BUBBLES =================
  async function viewBubbles(){
    const m=$("#main"); m.innerHTML="";
    const head=el("div",{class:"row"}, el("h2",{class:"section-title",style:"margin:0"},"🫧 Bubbles"),
      el("span",{class:"spacer"}),

    const grid=el("div",{class:"grid"});
    r.bubbles.forEach(b=>{
      const c=el("div",{class:"acard"});

      h.append(el("button",{class:"ghost small",style:"opacity:.5;padding:3px 7px",

  async function newBubble(){
    const name=prompt("Name your bubble (e.g. 'optimal transport'):"); if(!name)return;
    const r=await api("/api/bubbles",{method:"POST",body:JSON.stringify({name})});
    openBubble(r.slug);
  }
  async function deleteBubble(slug, name, onDone){
    if(!confirm(`Delete the bubble "${name}"?\n\nThis permanently removes all its report pages and figures. PDFs tagged with it will have this tag removed. This cannot be undone.`)) return;
    try{ await api("/api/bubbles/"+slug,{method:"DELETE"}); toast("Bubble deleted"); onDone&&onDone(); }
    catch(e){ toast("Error: "+e.message); }
  }

  function startBubbleRename(nameSpan, slug){
    const current=nameSpan.textContent.replace(/\s*\(suggested\)$/,"").trim();
    const inp=el("input",{value:current,style:"width:180px;flex-shrink:1"});
    const save=el("button",{class:"primary small",onclick:async()=>{
      const val=inp.value.trim(); if(!val||val===current){restore();return;}
      try{
        await api("/api/bubbles/"+slug,{method:"PATCH",body:JSON.stringify({name:val})});
        nameSpan.textContent=val; restore(); toast("Renamed");
      }catch(e){toast(e.message);}
    }},"Save");
    const cancel=el("button",{class:"ghost small",onclick:restore},"Cancel");
    inp.onkeydown=e=>{if(e.key==="Enter")save.click();if(e.key==="Escape")restore();};
    // swap span for the edit controls
    nameSpan.replaceWith(inp,save,cancel);
    inp.focus(); inp.select();
    function restore(){[save,cancel].forEach(b=>b.remove()); inp.replaceWith(nameSpan);}
  }

  // ================= TODOS =================
  // Global per-user task items, referenced from report pages as @<id>. S.todosById feeds the
  // @<id> linkifier; the list defaults to open items with an Open⇄Done toggle.
  async function loadTodos(){
    try{ S.todos=(await api("/api/todos")).todos||[]; }
    catch(e){ S.todos=[]; }
    S.todosById={}; S.todos.forEach(t=>S.todosById[t.id]=t);
    return S.todos;
  }
  async function viewTodos(){
    const m=$("#main"); m.innerHTML="";
    await loadTodos();
    const filter=S.todoFilter||"open";
    const head=el("div",{class:"row"},
      el("h2",{class:"section-title",style:"margin:0"},"✅ TODOs"),
      el("span",{class:"spacer"}),
      el("button",{class:"ghost small",onclick:()=>{ S.todoFilter=filter==="open"?"done":"open"; viewTodos(); }},
        filter==="open"?"Show done":"Show open"),
      el("button",{class:"primary small",onclick:newTodo},"+ New TODO"));
    m.append(head, el("div",{style:"height:14px"}));
    const items=S.todos.filter(t=>filter==="done"?t.done:!t.done);
    if(!items.length){ m.append(el("div",{class:"muted"},
      filter==="done"?"No completed TODOs.":"No open TODOs. Create one with + New TODO.")); return; }
    const grid=el("div",{class:"grid"});
    items.forEach(t=>{
      const c=el("div",{class:"acard",style:"cursor:pointer"});
      c.append(el("span",{style:"font-weight:600"+(t.done?";text-decoration:line-through;opacity:.6":"")},
        "@"+t.id+"  "+t.title));
      c.onclick=()=>viewTodo(t.id);
      grid.append(c);
    });
    m.append(grid);
  }
  async function newTodo(){
    const title=prompt("Title for the new TODO:"); if(!title)return;
    try{ const r=await api("/api/todos",{method:"POST",body:JSON.stringify({title,note:""})});
      await loadTodos(); viewTodo(r.todo.id); }
    catch(e){ toast(e.message); }
  }
  // Detail view — the shared landing for both an @<id> click and a TODO-list card click.
  async function viewTodo(id){
    S.view="todos"; S.bubble=null; stopPolling(); if(typeof stopNewsLive==="function")stopNewsLive();
    document.getElementById("main").classList.remove("detailmode");
    $("#previewArrow").classList.add("hide");   // left the bubble → hide the mobile preview link
    document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view==="todos"));
    pushRoute("todos/"+id);
    const m=$("#main"); m.innerHTML="";
    let t;
    try{ t=(await api("/api/todos/"+id)).todo; }
    catch(e){ m.append(el("div",{class:"err"},"TODO not found.")); return; }
    S.todosById[t.id]=t;
    m.append(el("a",{class:"wikilink",style:"font-size:13px",onclick:()=>{S.todoFilter="open";viewTodos();}},"← All TODOs"));

    // title row: done toggle + (inline-editable) title
    const titleWrap=el("div",{class:"row",style:"margin-top:10px;align-items:center;gap:10px"});
    const doneBtn=el("button",{class:"ghost small",style:"padding:4px 12px;font-size:13px",
      title:t.done?"Mark open":"Mark done",
      onclick:async()=>{ try{ await api("/api/todos/"+t.id,{method:"PATCH",body:JSON.stringify({done:!t.done})}); }
        catch(e){ toast(e.message); } viewTodo(id); }},
      t.done?"↩ Reopen":"✓ Mark done");
    const titleSpan=el("h2",{style:"margin:0"+(t.done?";text-decoration:line-through;opacity:.6":"")},"@"+t.id+"  "+t.title);
    const editTitle=el("button",{class:"ghost small",title:"Edit title",onclick:()=>{
      const inp=el("input",{value:t.title,style:"font-size:20px;font-weight:600;width:auto;min-width:240px"});
      const save=async()=>{ const v=inp.value.trim();
        if(v&&v!==t.title){ try{ await api("/api/todos/"+t.id,{method:"PATCH",body:JSON.stringify({title:v})}); }catch(e){toast(e.message);} }
        viewTodo(id); };
      inp.onkeydown=e=>{ if(e.key==="Enter")save(); if(e.key==="Escape")viewTodo(id); };
      titleSpan.replaceWith(inp); inp.focus(); inp.select();
    }},"✏️");
    titleWrap.append(doneBtn,titleSpan,editTitle);
    m.append(titleWrap);

    // note — rendered with the SAME renderMarkdown the reports use, so $…$ / $$…$$ math works
    const noteWrap=el("div",{class:"card",style:"margin-top:14px"});
    const noteBody=el("div",{});
    function renderNote(){ noteBody.innerHTML = (t.note&&t.note.trim())
      ? renderMarkdown(t.note)
      : '<span class="muted">No note yet. Click Edit to add one (supports the same math/markdown as reports).</span>'; }
    function editNote(){
      noteBody.innerHTML="";
      const ta=el("textarea",{style:"width:100%;min-height:160px;font-family:ui-monospace,monospace"}); ta.value=t.note||"";
      const save=el("button",{class:"primary small",onclick:async()=>{
        try{ await api("/api/todos/"+t.id,{method:"PATCH",body:JSON.stringify({note:ta.value})}); t.note=ta.value; }
        catch(e){ toast(e.message); } renderNote(); }},"Save");
      const cancel=el("button",{class:"ghost small",onclick:renderNote},"Cancel");
      noteBody.append(ta, el("div",{class:"row",style:"margin-top:8px;gap:8px"},save,cancel));
      ta.focus();
    }
    const noteHead=el("div",{class:"row"}, el("b",{},"Note"), el("span",{class:"spacer"}),
      el("button",{class:"ghost small",onclick:editNote},"Edit"));
    renderNote();
    noteWrap.append(noteHead,noteBody); m.append(noteWrap);

    // references — where this TODO is mentioned (@id), each a jump-link to that page
    const refs=t.refs||[];
    const refWrap=el("div",{style:"margin-top:14px"});
    refWrap.append(el("b",{},"References ("+refs.length+")"));
    if(refs.length){
      const ul=el("div",{style:"margin-top:6px"});
      refs.forEach(r=>ul.append(el("a",{class:"wikilink",style:"display:block;margin:3px 0",
        onclick:()=>openBubble(r.bubble_slug,{page:r.page_slug})}, r.bubble_name+" → "+r.page_title)));
      refWrap.append(ul);
    } else {
      refWrap.append(el("div",{class:"muted",style:"margin-top:6px"},
        "Not referenced yet. Type @"+t.id+" in a report page to link it here."));
    }
    m.append(refWrap);

    // delete — blocked while referenced (server enforces this too)
    const del=el("button",{class:"ghost small",style:"margin-top:18px"},"🗑 Delete TODO");
    if(refs.length){ del.disabled=true; del.title="Referenced — remove the @"+t.id+" references first."; }
    else del.onclick=async()=>{ if(!confirm("Delete TODO @"+t.id+"?"))return;
      try{ await api("/api/todos/"+t.id,{method:"DELETE"}); toast("TODO deleted"); S.todoFilter="open"; viewTodos(); }
      catch(e){ toast(e.message); } };
    m.append(del);
  }

  // ---- public share controls (toggle + copy link to current page/section) ----
  function shareUrl(){
    // Link to the page currently open, so viewers land where you are (append #section there).
    return location.origin+"/share/"+S.shareToken+"/"+(S.page||"overview");
  }
  function buildShareControls(slug){
    const wrap=el("span",{class:"row",style:"gap:6px;align-items:center;flex-shrink:0"});
    const btn=el("button",{class:"ghost small"});
    const copy=el("button",{class:"ghost small",title:"Copy link to the current page",
      style:"opacity:.8"},"📋 Copy link");
    function render(){
      btn.textContent=S.shareActive?"🟢 Sharing":"🔗 Share";
      btn.title=S.shareActive?"Public link is live — click to stop sharing"
                             :"Make this bubble viewable via an unlisted link";
      btn.classList.toggle("primary",false);
      copy.classList.toggle("hide",!S.shareActive);
    }
    btn.onclick=async()=>{
      btn.disabled=true;
      try{
        const r=await api("/api/bubbles/"+slug+"/share",
          {method:"POST",body:JSON.stringify({active:!S.shareActive})});
        S.shareActive=r.share_active; S.shareToken=r.share_token; render();
        toast(S.shareActive?"Sharing on — anyone with the link can view":"Sharing off");
      }catch(e){ toast(e.message); } finally{ btn.disabled=false; }
    };
    copy.onclick=async()=>{
      const url=shareUrl();
      try{ await navigator.clipboard.writeText(url); toast("🔗 Link copied"); }
      catch(e){ prompt("Copy this link:",url); }
    };
    wrap.append(btn,copy); render();
    return wrap;
  }

  // ================= BUBBLE DETAIL (Notion-like multi-page) =================
  async function openBubble(slug,{noRoute=false,page=null}={}){
    // Re-entrancy guard: if two openBubble calls race (e.g. a quick click then another nav),
    // a superseded in-flight call could still build a stale workspace/editor over the new one.
    // A newer call bumps the token so the older one bails after its await.
    const token=S.openToken=(S.openToken||0)+1;
    if(!noRoute)pushRoute("bubble/"+slug);
    if(S.editor){ try{S.editor.destroy();}catch(e){} S.editor=null; }
    stopPolling();
    S.bubble=slug; S.chat=[]; S.page=null; S.pages=[]; S.sessionId=null; S.sessionTitle=null;
    S.previewEl=null; S.remoteChangePending=false; S.papersPane=null; S.chatPane=null; S.detailWrap=null;
    S.baseMtime=null; S.saving=false; S.syncState="synced";
    S.shareActive=false; S.shareToken=""; S.editingTitles=false; S.nameInput=null;
    const m=$("#main"); m.innerHTML=""; m.classList.add("detailmode");
    const b=(await api("/api/bubbles/"+slug)).bubble;
    if(S.openToken!==token) return;   // a newer navigation started while we awaited — bail
    // Load TODOs so the preview can resolve @<id> refs; re-render once they're in.
    loadTodos().then(()=>{ if(S.bubble===slug && S.editor) updatePreview(); });
    S.bubbleAssets=b.assets||[];
    S.shareActive=!!b.share_active; S.shareToken=b.share_token||"";
    // Editable bubble title. For approved bubbles the rename lives in the "✏️ Edit titles"
    // toggle by the sync badge (alongside page-title editing); unapproved bubbles have no
    // page tabs, so they keep an inline rename pencil here.
    const nameSpan=el("span",{class:"truncate",style:"max-width:60vw"},b.name+(b.approved?"":" (suggested)"));
    S.nameSpan=nameSpan;
    const titleRow=el("div",{class:"row",style:"margin:10px 0 12px;align-items:center;gap:8px;flex-wrap:wrap"},
      el("h2",{class:"section-title",style:"margin:0"},"🫧 "), nameSpan);
    if(!b.approved){
      titleRow.append(el("button",{class:"ghost small",title:"Rename bubble",
        style:"opacity:.5;padding:4px 7px;flex-shrink:0",
        onclick:()=>startBubbleRename(nameSpan,b.slug)},"✏️"));
    }
    titleRow.append(el("span",{class:"spacer"}));
    if(b.approved){
      // Preview + share controls are desktop-only: on mobile the header collapses to just the
      // bubble name (sharing/preview are done from a larger screen) to keep the page minimal.
      // "👁 Preview" opens the server-rendered, read-only page — exactly what a share viewer sees.
      const tools=el("span",{class:"row desktop-only-tool",style:"gap:6px;align-items:center;flex-shrink:0"});
      tools.append(el("button",{class:"ghost small",title:"Preview the read-only page your share viewers see",
        onclick:()=>window.open("/api/bubbles/"+slug+"/preview/"+(S.page||S.home||"overview"),"_blank")},"👁 Preview"));
      tools.append(buildShareControls(slug));
      titleRow.append(tools);
    }
    m.append(titleRow);

    S.chatCollapsed = localStorage.getItem("li_chat")==="1";
    const wrap=el("div",{id:"detail"});
    if(S.chatCollapsed) wrap.classList.add("chat-collapsed");
    const left=el("div",{class:"pane editor-pane"}), right=el("div",{class:"pane chat-pane"});
    S.detailWrap=wrap; S.chatPane=right;
    wrap.append(left,right); m.append(wrap);

    if(!b.approved){ buildApprovalPane(left,b); }
    else { buildWorkspace(left,b); }
    buildChatPane(right,b);
    if(b.approved) buildMobileBubbleTools(m,b,wrap,right);
    // mobile ↗ preview link in the topbar: only meaningful on an approved bubble (it has pages)
    $("#previewArrow").classList.toggle("hide", !b.approved);
    // Deep-link: restore a specific page (e.g. after a refresh) without clobbering history.
    if(b.approved && page && page!==S.home && S.pages.some(p=>p.page_slug===page)){
      switchPage(page,{noRoute:true});
    }
  }

  function buildApprovalPane(left,b){
    const bd=el("div",{class:"bd col"});
    bd.append(el("p",{},"This bubble was auto-suggested. Approve it to start its report pages."));
    if(b.assets.length)bd.append(el("div",{class:"muted"},"Triggered by: "+b.assets.map(a=>a.title).join(", ")));
    const instr=el("textarea",{rows:"3",placeholder:"Optional: what should this report focus on?"});
    bd.append(el("label",{class:"muted"},"Report instructions (optional)"),instr);
    bd.append(el("button",{class:"primary",onclick:async()=>{
      await api("/api/bubbles/"+b.slug+"/approve",{method:"POST",body:JSON.stringify({instructions:instr.value})});
      toast("Approved"); openBubble(b.slug);
    }},"Approve this bubble"));
    left.append(el("div",{class:"hd"},el("b",{},"Report")), bd);
  }

  // ---- workspace: page tabs + Toast UI editor ----
  function buildWorkspace(left,b){
    S.pages=b.pages||[]; S.home=b.home; S.bubbleInstr=b.instructions||"";
    fetchRefs().then(()=>updatePreview());   // bubble-wide eqn/thm numbering for the preview
    const tabs=el("div",{class:"ptabs",id:"ptabs"});
    const editorWrap=el("div",{id:"editorWrap"});
    S.previewEl=el("div",{id:"previewWrap",class:"preview"});
    // Open in the user's last-used view mode for this bubble (persisted across refreshes),
    // defaulting to reading view. The toolbar dropdown switches to editor / side-by-side.
    S.viewMode=loadViewMode(b.slug);
    const host=el("div",{id:"editorHost",class:"mode-"+S.viewMode});
    host.append(editorWrap, S.previewEl);
    left.append(tabs,host);

    // PDFs strip (pencil toggles an edit mode for adding/removing papers). Only relevant when
    // editing, so it's hidden in pure reading view and shown in edit / split.
    const pdfs=el("div",{class:"bd bubble-papers-inline",
      style:"flex:0 0 auto;border-top:1px solid var(--line);max-height:200px;overflow:auto"});
    S.papersPane=pdfs;
    pdfs.classList.toggle("hide", S.viewMode==="view");
    renderBubblePdfs(pdfs,b,false);
    left.append(pdfs);

    // init editor with the home page content
    initEditor(editorWrap, b.content||"");
    S.page=b.home; S.syncState="synced";
    refreshTabs();
    startPolling();
    primeSync();          // capture the home page's base mtime for conflict detection
    // delegated internal-link navigation (page: and todo: schemes)
    left.addEventListener("click",e=>{
      const p=e.target.closest('a[href^="page:"]');
      if(p){ e.preventDefault(); switchPage(decodeURIComponent(p.getAttribute("href").slice(5))); return; }
      const t=e.target.closest('a[href^="todo:"]');
      if(t){ e.preventDefault(); viewTodo(+t.getAttribute("href").slice(5)); } });
    // Overleaf-style reverse sync: double-click the rendered preview → jump the editor cursor.
    S.previewEl.addEventListener("dblclick",syncPreviewToSource);
  }
