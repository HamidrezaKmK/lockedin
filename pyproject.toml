[project]
name = "lockedin"
version = "0.1.0"
description = "The ultimate research assistant for grad students"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",   # multipart/form-data uploads
    "pyyaml",
    "pydantic>=2",
    "openai>=1.0",        # Ollama (OpenAI-compatible) + OpenAI
    "anthropic>=0.25",    # Claude (native streaming + PDF documents)
    "pypdf>=4.0",         # pure-Python PDF text extraction
    "python-slugify",     # "Generative Modeling" -> "generative-modeling"
    "typer",
    "google-genai",           # Gemini via Google GenAI SDK
    "python-dotenv",          # load DEV_USERNAME/DEV_PASSWORD from .env in DEV mode
]

[project.scripts]
lockedin = "lockedin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockedin"]
